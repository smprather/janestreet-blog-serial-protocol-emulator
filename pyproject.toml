# This project is Verilog plus a small set of standalone Python tools; it is not
# a Python package. `uv init` scaffolded one (a src/ layout with a "Hello from"
# entry point), which was removed: the real tools live in tools/ and are run
# directly, the entry point pointed at a stub, and `pip install .` produced a
# console script that printed a greeting.
#
# What is kept is the interpreter floor and the lint config, because the tools
# are checked with ruff and they use 3.12 syntax (PEP 604 unions, `list[int]`).
# They have no third-party dependencies on purpose: regress/run_all.sh must work on a
# clean clone with nothing but python3, iverilog, verilator and yosys.

[project]
name = "janestreet-blog-serial-protocol-emulator"
version = "0.2.0"
description = "Programmable serial-protocol emulator for Tiny Tapeout (IHP 130nm): protocol logic as firmware, not gates."
readme = "README.md"
authors = [
    { name = "Myles Prather", email = "smprather@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

# Optional GUI stack (plan Task 2/Task 6): the host_gui core contract modules
# (protocol, image, transport, session, server logic) run dependency-free; a
# real serial device needs pyserial and the HTTP/WebSocket server needs
# fastapi+uvicorn. Install with: pip install .[host-gui]
#
# `httpx2` is here because starlette's TestClient imports it, and this
# repository's own API tests drive the server THROUGH that client. It was
# missing until the extra was actually installed and run (2026-09-25): the
# documented flow - install this extra, then run the host gate - failed with
# "the starlette.testclient module requires the httpx2 package", so three
# tests errored for a reason that had nothing to do with the code under test.
# An extra that cannot run the tests it exists to enable is not an extra.
[project.optional-dependencies]
host-gui = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pyserial>=3.5",
    "httpx2>=2.13",
]

[tool.pyright]
# The type checker must see the SAME environment the gate runs in. Without
# this, every import of the optional server stack reads as missing and each
# use of those names is reported "possibly unbound" - a wall of diagnostics
# about a dependency that is installed, in the repo's own venv.
venvPath = "."
venv = ".venv"

[tool.setuptools]
# This distribution ships NO importable package, and saying so explicitly is
# what makes `pip install .[host-gui]` work at all. Without this section,
# setuptools' flat-layout auto-discovery finds tb/, sim/, rtl/, wiki/, flow/,
# regress/, firmware/ and diagrams/, cannot choose, and FAILS WHILE BUILDING -
# so the install step the runbook gives the operator never ran, and the error
# points at packaging rather than at a missing dependency. The tools live in
# tools/ and are run from the clone; the extra exists to bring in fastapi,
# uvicorn and pyserial, and nothing else.
packages = []
py-modules = []

[tool.ruff]
line-length = 90
target-version = "py312"
