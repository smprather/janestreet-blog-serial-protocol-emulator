# info.yaml — Tiny Tapeout project metadata.
#
# This file and rtl/tt_um_protocol_emulator.v are the two things that make the
# repo submittable. Everything else is blocks and testbenches.
#
# tiles: the blog says "Set the tile size in info.yaml to 6x4" and "The current
# maximum area is 6x4 tiles per design", with 8x4 described only as a
# possibility they are working on (~30% more area) that would be announced by
# email and a page update. So 6x4 is the number, and it is checked against the
# verbatim source at wiki/raw/articles/janestreet-competition-blog-fulltext.md.
#
# TT tile notation is WIDTH x HEIGHT, which wiki/reference/sram-budget.md shows
# is the load-bearing detail: at the template's 167 x 108 um tile, 6x4 is
# 1002 x 432 um, a 2.3:1 die. Shape, not area, is what decides which SRAM
# macros fit -- the same 24 tiles arranged 4x6 would be near-square and would
# lose the entire 64-bit-wide macro family.
#
# clock_hz: 60 MHz is the operating point (ADR-005). It makes 50 ns -- the
# 10BASE-T half-UI, the binding TX constraint -- exactly 3 ticks, keeps every
# other hard protocol exact, and refines the RX grid by 50% (SPB 8 -> 12).
# 66 MHz is NOT usable: it provably fails the 802.3 TX jitter window at any
# edge placement, dithered or not. Both flow configs target signoff at the
# same 60 MHz operating point (16.667 ns); the 66 MHz target is retired.
# See wiki/decisions/adr-005-60mhz-turbo.md and concepts/tx-timing-generation.md.

project:
  title: "Protocol Emulator"
  author: "Myles Prather"
  discord: ""
  description: >-
    A programmable serial-protocol emulator: protocol logic runs as firmware on
    a small core rather than as a state machine in gates, so the chip speaks
    UART, SPI, I2C, JTAG, SWD, PS/2, CAN, USB-LS or 10BASE-T by loading a
    different program. A shared SERDES and line-code pipeline carry the
    protocols whose control flow is per-word; the firmware core bit-bangs the
    ones whose control flow is per-bit.
  language: "Verilog"
  clock_hz: 60000000
  tiles: "6x4"
  top_module: "tt_um_protocol_emulator"

  # Order matters only in that every module must be present; the TT precheck
  # compiles these together. pe_soc instantiates pe_imem (the SRAM
  # wrapper), pe_pinmux (the per-pin matrix), the 10BASE-T receive chain
  # (pe_dru -> pe_manch -> pe_eth_mac with pe_crc and pe_fbuf) and -- through
  # pe_imem/pe_fbuf -- the SRAM macro. The .bb.v is the macro's empty port
  # shell, which is what lets an iverilog/verilator compile of these sources
  # resolve the instance; the real macro model and GDS come from the PDK at
  # build time.
  # Measured before the fix: iverilog on the three listed files ended in
  # "Unknown module type: RM_IHPSG13_1P_1024x16_c2_bm_bist".
  source_files:
    - "rtl/pe_cpu.v"
    - "rtl/pe_imem.v"
    - "rtl/pe_pinmux.v"
    - "rtl/pe_dru.v"
    - "rtl/pe_manch.v"
    - "rtl/pe_crc.v"
    - "rtl/pe_eth_mac.v"
    - "rtl/pe_fbuf.v"
    - "rtl/pe_ctrl.v"
    - "rtl/vendor/RM_IHPSG13_1P_1024x16_c2_bm_bist.bb.v"
    - "rtl/pe_soc.v"
    - "rtl/tt_um_protocol_emulator.v"

# Pin map. Keep this in step with the header comment of the wrapper: this file
# is what the TT docs render, and a wrong pinout here is a wrong datasheet.
pinout:
  ui[0]: "UART RX (protocol input pin)"
  ui[1]: "run (1 = execute firmware, 0 = hold at PC 0)"
  ui[2]: "10BASE-T RX (Manchester line input)"
  ui[3]: "SPI SCLK (pe_ctrl loader clock)"
  ui[4]: "SPI MOSI (pe_ctrl loader data, MSB-first)"
  ui[5]: "SPI CS_N (pe_ctrl loader select, active low)"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  uo[0]: "UART TX (protocol output pin)"
  uo[1]: "heartbeat (timer bit 7)"
  uo[2]: "dbg_pc[0]"
  uo[3]: "dbg_pc[1]"
  uo[4]: "dbg_pc[2]"
  uo[5]: "dbg_pc[3]"
  uo[6]: "dbg_pc[4]"
  uo[7]: "dbg_pc[5]"

  uio[0]: "SDA (open-drain; needs an external pull-up)"
  uio[1]: "SCL (open-drain; needs an external pull-up)"
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

documentation:
  # The board must supply what the pads cannot: I2C pull-ups today, and per
  # wiki/reference/protocol-pin-budget.md a transceiver for CAN, a transformer
  # for 10BASE-T and a pull-up for USB when those land.
  external_hw: "I2C pull-ups (4.7k) on uio[0] and uio[1] for the I2C milestone."
