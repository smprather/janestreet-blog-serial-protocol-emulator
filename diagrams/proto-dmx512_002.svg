<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:887px;height:1014px;background:#FFFFFF;" width="887px" height="1014px" viewBox="0 0 887 1014" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="155"><text x="144.601" y="29.966" fill="#000" font-size="14" textLength="596.397" font-weight="700" font-family="monospace">DMX512-A — the three START-code ranges, and the one this firmware sends</text></g><rect x="54.2" y="172.842" width="801.799" height="110.824" fill="none" style="stroke:#B0B0B0;stroke-width:1.5;"/><rect x="54.2" y="301.666" width="801.799" height="110.824" fill="none" style="stroke:#B0B0B0;stroke-width:1.5;"/><rect x="54.2" y="430.49" width="801.799" height="110.824" fill="none" style="stroke:#B0B0B0;stroke-width:1.5;"/><g><title>START code</title><rect x="66.7" y="129.136" width="8" height="794.887" fill="#000" fill-opacity="0"/><line x1="70.2" y1="129.136" x2="70.2" y2="924.022" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>0x00</title><rect x="166.3" y="129.136" width="8" height="794.887" fill="#000" fill-opacity="0"/><line x1="169.8" y1="129.136" x2="169.8" y2="924.022" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>0x01..0x7F</title><rect x="299.5" y="129.136" width="8" height="794.887" fill="#000" fill-opacity="0"/><line x1="303" y1="129.136" x2="303" y2="924.022" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>0x80..0xFF</title><rect x="453.699" y="129.136" width="8" height="794.887" fill="#000" fill-opacity="0"/><line x1="457.199" y1="129.136" x2="457.199" y2="924.022" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>receiver</title><rect x="836.499" y="129.136" width="8" height="794.887" fill="#000" fill-opacity="0"/><line x1="839.999" y1="129.136" x2="839.999" y2="924.022" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><rect x="21.201" y="76" width="98" height="52.136" fill="#EEF3FB" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="28.201" y="97.966" fill="#16324F" font-size="14" textLength="84" font-family="monospace">START code</text><text x="45" y="117.034" fill="#16324F" font-size="14" textLength="50.4" font-family="monospace">slot 0</text><rect x="129.2" y="76" width="81.2" height="52.136" fill="#DCEEE0" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="153" y="97.966" fill="#16324F" font-size="14" textLength="33.6" font-family="monospace">0x00</text><text x="136.2" y="117.034" fill="#16324F" font-size="14" textLength="67.2" font-family="monospace">all-slot</text><rect x="220.4" y="76" width="165.199" height="52.136" fill="#EEF3FB" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="261" y="97.966" fill="#16324F" font-size="14" textLength="84" font-family="monospace">0x01..0x7F</text><text x="227.4" y="117.034" fill="#16324F" font-size="14" textLength="151.199" font-family="monospace">first 1..127 slots</text><rect x="395.599" y="76" width="123.2" height="52.136" fill="#EEF3FB" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="415.199" y="97.966" fill="#16324F" font-size="14" textLength="84" font-family="monospace">0x80..0xFF</text><text x="402.599" y="117.034" fill="#16324F" font-size="14" textLength="109.2" font-family="monospace">start address</text><text x="803.399" y="125.034" fill="#5A3D12" font-size="14" textLength="67.2" font-family="monospace">receiver</text><ellipse cx="839.999" cy="58.568" rx="8" ry="8" fill="#FBE9CF" style="stroke:#B8813A;stroke-width:0.5;"/><path d="M839.999,66.568 L839.999,93.568 M826.999,74.568 L852.999,74.568 M839.999,93.568 L826.999,108.568 M839.999,93.568 L852.999,108.568" style="stroke:#B8813A;stroke-width:0.5;" fill="none"/><rect x="21.201" y="924.022" width="98" height="52.136" fill="#EEF3FB" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="28.201" y="945.988" fill="#16324F" font-size="14" textLength="84" font-family="monospace">START code</text><text x="45" y="965.056" fill="#16324F" font-size="14" textLength="50.4" font-family="monospace">slot 0</text><rect x="129.2" y="924.022" width="81.2" height="52.136" fill="#DCEEE0" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="153" y="945.988" fill="#16324F" font-size="14" textLength="33.6" font-family="monospace">0x00</text><text x="136.2" y="965.056" fill="#16324F" font-size="14" textLength="67.2" font-family="monospace">all-slot</text><rect x="220.4" y="924.022" width="165.199" height="52.136" fill="#EEF3FB" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="261" y="945.988" fill="#16324F" font-size="14" textLength="84" font-family="monospace">0x01..0x7F</text><text x="227.4" y="965.056" fill="#16324F" font-size="14" textLength="151.199" font-family="monospace">first 1..127 slots</text><rect x="395.599" y="924.022" width="123.2" height="52.136" fill="#EEF3FB" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="415.199" y="945.988" fill="#16324F" font-size="14" textLength="84" font-family="monospace">0x80..0xFF</text><text x="402.599" y="965.056" fill="#16324F" font-size="14" textLength="109.2" font-family="monospace">start address</text><text x="803.399" y="938.988" fill="#5A3D12" font-size="14" textLength="67.2" font-family="monospace">receiver</text><ellipse cx="839.999" cy="951.59" rx="8" ry="8" fill="#FBE9CF" style="stroke:#B8813A;stroke-width:0.5;"/><path d="M839.999,959.59 L839.999,986.59 M826.999,967.59 L852.999,967.59 M839.999,986.59 L826.999,1001.59 M839.999,986.59 L852.999,1001.59" style="stroke:#B8813A;stroke-width:0.5;" fill="none"/><polygon points="827.999,156.842,837.999,160.842,827.999,164.842,831.999,160.842" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="70.2" y1="160.842" x2="833.999" y2="160.842" style="stroke:#333;stroke-width:1;"/><text x="77.2" y="155.033" fill="#000" font-size="13" textLength="109.2" font-family="monospace">slot 0 arrives</text><path d="M54.2,172.842 L504.8,172.842 L504.8,182.548 L494.8,192.548 L54.2,192.548 L54.2,172.842" style="stroke:#B0B0B0;stroke-width:1.5;" fill="#FBFBFB"/><rect x="54.2" y="172.842" width="801.799" height="110.824" fill="none" style="stroke:#B0B0B0;stroke-width:1.5;"/><text x="69.2" y="187.739" fill="#000" font-size="13" textLength="405.6" font-weight="700" font-family="monospace">the all-slot code — the ONLY one this firmware sends</text><polygon points="157.8,222.254,167.8,226.254,157.8,230.254,161.8,226.254" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="70.2" y1="226.254" x2="163.8" y2="226.254" style="stroke:#333;stroke-width:1;"/><text x="77.2" y="220.445" fill="#000" font-size="13" textLength="31.2" font-family="monospace">0x00</text><polygon points="827.999,271.666,837.999,275.666,827.999,279.666,831.999,275.666" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="169.8" y1="275.666" x2="833.999" y2="275.666" style="stroke:#333;stroke-width:1;"/><text x="176.8" y="252.151" fill="#000" font-size="13" textLength="280.8" font-family="monospace">every one of the 512 data slots is a</text><text x="176.8" y="269.857" fill="#000" font-size="13" textLength="327.6" font-family="monospace">dimmer or fixture level; no follow-up slot</text><path d="M54.2,301.666 L263,301.666 L263,311.372 L253,321.372 L54.2,321.372 L54.2,301.666" style="stroke:#B0B0B0;stroke-width:1.5;" fill="#FBFBFB"/><rect x="54.2" y="301.666" width="801.799" height="110.824" fill="none" style="stroke:#B0B0B0;stroke-width:1.5;"/><text x="69.2" y="316.563" fill="#000" font-size="13" textLength="163.8" font-weight="700" font-family="monospace">the patch-cable range</text><polygon points="291,351.078,301,355.078,291,359.078,295,355.078" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="70.2" y1="355.078" x2="297" y2="355.078" style="stroke:#333;stroke-width:1;"/><text x="77.2" y="349.269" fill="#000" font-size="13" textLength="93.6" font-family="monospace">0x01 .. 0x7F</text><polygon points="827.999,400.49,837.999,404.49,827.999,408.49,831.999,404.49" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="303" y1="404.49" x2="833.999" y2="404.49" style="stroke:#333;stroke-width:1;"/><text x="310" y="380.975" fill="#000" font-size="13" textLength="273" font-family="monospace">the following slots are patch-cable</text><text x="310" y="398.681" fill="#000" font-size="13" textLength="296.4" font-family="monospace">positions: code 0x2A starts at slot 42</text><path d="M54.2,430.49 L278.6,430.49 L278.6,440.196 L268.6,450.196 L54.2,450.196 L54.2,430.49" style="stroke:#B0B0B0;stroke-width:1.5;" fill="#FBFBFB"/><rect x="54.2" y="430.49" width="801.799" height="110.824" fill="none" style="stroke:#B0B0B0;stroke-width:1.5;"/><text x="69.2" y="445.387" fill="#000" font-size="13" textLength="179.4" font-weight="700" font-family="monospace">the start-address range</text><polygon points="445.199,479.902,455.199,483.902,445.199,487.902,449.199,483.902" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="70.2" y1="483.902" x2="451.199" y2="483.902" style="stroke:#333;stroke-width:1;"/><text x="77.2" y="478.093" fill="#000" font-size="13" textLength="93.6" font-family="monospace">0x80 .. 0xFF</text><polygon points="827.999,529.314,837.999,533.314,827.999,537.314,831.999,533.314" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="457.199" y1="533.314" x2="833.999" y2="533.314" style="stroke:#333;stroke-width:1;"/><text x="464.199" y="509.799" fill="#000" font-size="13" textLength="288.6" font-family="monospace">the NEXT TWO slots are one big-endian</text><text x="464.199" y="527.505" fill="#000" font-size="13" textLength="358.8" font-family="monospace">16-bit slot number, and the frame starts there</text><path d="M32.401,560.314 L32.401,782.314 L877.401,782.314 L877.401,570.314 L867.401,560.314 L32.401,560.314" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M867.401,560.314 L867.401,570.314 L877.401,570.314 L867.401,560.314" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="142.5" y="579.211" fill="#000" font-size="13" textLength="616.2" font-family="monospace">DMX512-A defines exactly these three ranges, and the START code is what tells a</text><text x="142.5" y="596.917" fill="#000" font-size="13" textLength="600.6" font-family="monospace">receiver what the 512 slots MEAN. Sending 512 slots with no START code is the</text><text x="142.5" y="614.623" fill="#000" font-size="13" textLength="538.2" font-family="monospace">most common way to end up with a working fixture that lights nothing.</text><text x="142.5" y="632.329" fill="#000" font-size="13" font-family="monospace"> </text><text x="142.5" y="650.035" fill="#000" font-size="13" textLength="585" font-family="monospace">THIS FIRMWARE SENDS 0x00 AND NOTHING ELSE, and it goes out through the SAME</text><text x="142.5" y="667.741" fill="#000" font-size="13" textLength="600.6" font-family="monospace">transmitter as the data slots — so there is one bit format in the file rather</text><text x="142.5" y="685.447" fill="#000" font-size="13" textLength="600.6" font-family="monospace">than two, and a START code sent by a different code path is a START code that</text><text x="142.5" y="703.153" fill="#000" font-size="13" textLength="218.4" font-family="monospace">can disagree with the slots.</text><text x="142.5" y="720.859" fill="#000" font-size="13" font-family="monospace"> </text><text x="142.5" y="738.565" fill="#000" font-size="13" textLength="592.8" font-family="monospace">The TB's expected-slot function returns 0x00 for slot 0 and (n-1) &amp; 0xFF for</text><text x="142.5" y="756.271" fill="#000" font-size="13" textLength="608.4" font-family="monospace">every slot after it, so a START code from either of the other two ranges would</text><text x="142.5" y="773.977" fill="#000" font-size="13" textLength="429" font-family="monospace">be caught on slot 0 and on the slot count that follows.</text><path d="M15,792.786 L15,908.786 L324,908.786 L324,802.786 L314,792.786 L15,792.786" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M314,792.786 L314,802.786 L324,802.786 L314,792.786" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="21" y="811.683" fill="#000" font-size="13" textLength="265.2" font-family="monospace">WHY 0x00 IS THE RIGHT CHOICE FOR A</text><text x="21" y="829.389" fill="#000" font-size="13" textLength="265.2" font-family="monospace">FIXTURE: it is the only range that</text><text x="21" y="847.095" fill="#000" font-size="13" textLength="273" font-family="monospace">needs no follow-up slot, so all 512</text><text x="21" y="864.801" fill="#000" font-size="13" textLength="218.4" font-family="monospace">payload slots are payload. A</text><text x="21" y="882.507" fill="#000" font-size="13" textLength="288.6" font-family="monospace">start-address code would spend two of</text><text x="21" y="900.213" fill="#000" font-size="13" textLength="179.4" font-family="monospace">the 513 on the address.</text><?plantuml-src TLJjRkeu4FsVfnZrIliXDIY1jfVjIYjnsr2GBh02LksL-6DY1wmcTjOs5_fl7sAVS9zaP-nGGdiBGcsSCpFdd9cnawuKS3zvkawxyG3---TVS5k1FoC4B9Q3-JBEDHTWcDe8UmbCSG_GYa3IGY5DjMT6W1MAsyW-IrKpmohWec2xqWsrSbDM2PXefMtDSi5Re3-PSJANDLFk2ykVDqRl5B_JfJRmIOYYLwm_06l3XMc0L-ocODS_1bBv1fRUzBfNHGiso9qsxyeMQ_5R_XxMBhZkzzCUUmjfbRfcFPvsMu25-7idL2uUi5BzWvBq_H1-LZgXRxkqCNhVlEpvJnJL9_rmuPi8rCILigLsa5m0ix18pc798KbMYfLbJ20FcIS9VEAv4E8zDkrqaiFduKfX_wq3V4oxdu52RHERletf9nGpn1Zh