t 0</text><text x="165.6" y="91.102" fill="#16324F" font-size="14" textLength="117.599" font-family="monospace">the START code</text><rect x="395.6" y="69.136" width="64.4" height="33.068" fill="#EEF3FB" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="402.6" y="91.102" fill="#16324F" font-size="14" textLength="50.4" font-family="monospace">slot 1</text><rect x="470" y="69.136" width="64.4" height="33.068" fill="#EEF3FB" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="477" y="91.102" fill="#16324F" font-size="14" textLength="50.4" font-family="monospace">slot 2</text><rect x="544.4" y="69.136" width="39.2" height="33.068" fill="#EEF3FB" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="551.4" y="91.102" fill="#16324F" font-size="14" textLength="25.2" font-family="monospace">...</text><rect x="593.6" y="50.068" width="81.2" height="52.136" fill="#EEF3FB" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="600.6" y="72.034" fill="#16324F" font-size="14" textLength="67.2" font-family="monospace">slot 512</text><text x="600.6" y="91.102" fill="#16324F" font-size="14" textLength="67.2" font-family="monospace">the last</text><rect x="158.6" y="535.912" width="131.599" height="52.136" fill="#FBE9CF" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="199.2" y="557.878" fill="#16324F" font-size="14" textLength="50.4" font-family="monospace">slot 0</text><text x="165.6" y="576.946" fill="#16324F" font-size="14" textLength="117.599" font-family="monospace">the START code</text><rect x="395.6" y="535.912" width="64.4" height="33.068" fill="#EEF3FB" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="402.6" y="557.878" fill="#16324F" font-size="14" textLength="50.4" font-family="monospace">slot 1</text><rect x="470" y="535.912" width="64.4" height="33.068" fill="#EEF3FB" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="477" y="557.878" fill="#16324F" font-size="14" textLength="50.4" font-family="monospace">slot 2</text><rect x="544.4" y="535.912" width="39.2" height="33.068" fill="#EEF3FB" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="551.4" y="557.878" fill="#16324F" font-size="14" textLength="25.2" font-family="monospace">...</text><rect x="593.6" y="535.912" width="81.2" height="52.136" fill="#EEF3FB" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="600.6" y="557.878" fill="#16324F" font-size="14" textLength="67.2" font-family="monospace">slot 512</text><text x="600.6" y="576.946" fill="#16324F" font-size="14" textLength="67.2" font-family="monospace">the last</text><polygon points="415.8,130.91,425.8,134.91,415.8,138.91,419.8,134.91" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="224.4" y1="134.91" x2="421.8" y2="134.91" style="stroke:#333;stroke-width:1;"/><text x="231.4" y="129.101" fill="#000" font-size="13" textLength="179.4" font-family="monospace">what the 512 slots MEAN</text><polygon points="490.2,144.91,500.2,148.91,490.2,152.91,494.2,148.91" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="427.8" y1="148.91" x2="496.2" y2="148.91" style="stroke:#333;stroke-width:1;"/><polygon points="552,158.91,562,162.91,552,166.91,556,162.91" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="502.2" y1="162.91" x2="558" y2="162.91" style="stroke:#333;stroke-width:1;"/><polygon points="622.199,172.91,632.199,176.91,622.199,180.91,626.199,176.91" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="564" y1="176.91" x2="628.199" y2="176.91" style="stroke:#333;stroke-width:1;"/><path d="M176.2,189.91 L176.2,429.91 L682.2,429.91 L682.2,199.91 L672.2,189.91 L176.2,189.91" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M672.2,189.91 L672.2,199.91 L682.2,199.91 L672.2,189.91" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="194.7" y="208.807" fill="#000" font-size="13" textLength="319.8" font-family="monospace">DMX512-A defines three START-code ranges:</text><text x="210.3" y="226.513" fill="#000" font-size="13" textLength="436.8" font-family="monospace">0x00        the all-slot code: every one of the 512 data</text><text x="296.1" y="244.219" fill="#000" font-size="13" textLength="265.2" font-family="monospace">slots is a dimmer or fixture level</text><text x="210.3" y="261.925" fill="#000" font-size="13" textLength="444.6" font-family="monospace">0x01..0x7F  first 1 to 127 slots: the following slots are</text><text x="296.1" y="279.631" fill="#000" font-size="13" textLength="163.8" font-family="monospace">patch-cable positions</text><text x="210.3" y="297.337" fill="#000" font-size="13" textLength="413.4" font-family="monospace">0x80..0xFF  start address: the NEXT TWO slots are one</text><text x="296.1" y="315.043" fill="#000" font-size="13" textLength="343.2" font-family="monospace">big-endian 16-bit slot number, and the frame</text><text x="296.1" y="332.749" fill="#000" font-size="13" textLength="93.6" font-family="monospace">starts there</text><text x="194.7" y="350.455" fill="#000" font-size="13" textLength="397.8" font-family="monospace">THIS FIRMWARE SENDS 0x00 AND NOTHING ELSE. The TB's</text><text x="194.7" y="368.161" fill="#000" font-size="13" textLength="390" font-family="monospace">expected-slot function returns 0x00 for slot 0 and</text><text x="194.7" y="385.867" fill="#000" font-size="13" textLength="413.4" font-family="monospace">(n-1) &amp; 0xFF for every slot after it, so a start code</text><text x="194.7" y="403.573" fill="#000" font-size="13" textLength="397.8" font-family="monospace">from the other two ranges would be caught on slot 0</text><text x="194.7" y="421.279" fill="#000" font-size="13" textLength="273" font-family="monospace">and on the slot count that follows.</text><path d="M15,440.088 L15,520.088 L433,520.088 L433,450.088 L423,440.088 L15,440.088" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M423,440.088 L423,450.088 L433,450.088 L423,440.088" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="21" y="458.985" fill="#000" font-size="13" textLength="382.2" font-family="monospace">WHY 0x00 IS THE RIGHT CHOICE FOR A FIXTURE: it is</text><text x="21" y="476.691" fill="#000" font-size="13" textLength="397.8" font-family="monospace">the only range that needs no follow-up slot, so the</text><text x="21" y="494.397" fill="#000" font-size="13" textLength="390" font-family="monospace">512 payload slots are all payload. A start-address</text><text x="21" y="512.103" fill="#000" font-size="13" textLength="366.6" font-family="monospace">code would spend two of the 513 on the address.</text><?plantuml-src TLHTRzem57tFhxZgf7r8JKIW7niFasW91Qd0H3Ara_RY93PO3NPcEmFUzYFs2_TBTcsdXRRKUI3Ovzvpxxd7CTnK58RJ-_Eu6mxWtv-_O5OKqcomoA2G9TMdG4JfDgMW-CirCAxM6w8eQ2fA7UW7BcgYo1fAoaXJcP4KPaRM5APII5sJWfO7e6z46LxmcWXpHOg7fPADAAzb9HMyevJrMFu6MAgIgXPuHYuOEJyEjFGjBBxeTS_O0Ioblneg2dg3hFKhUfRRvqtuOG5vnpu7q85ISjCUzjmAWdfV59peIXhe_1JFzJq1eY6rrFHBmOv4n1uH7pdg-gFkywCeYlp-y4W8ZjbNK15jFEms2588lo85z66p8iOD6u5W8pHCay4im4CBwGPfrxqCWtJeNZ1QI8Fc-4qLfATs0_P-GaDmGJLcLBJjEhHTWo9YINKViG2TRQS3xRBKfAf2Lwn5ze5YvfqpdsHFfPN4a02UBryk-fD0oTThh0TdmVZMD6ZL2jDKZtHn57MsboEmJjOeCHW9SVVIP-Wx4YQhIcwuMBPfqUul-MfYYbLOa1nlK2qrDrmAtL9yxbYA4L9eWqC0KfQAwZRtBBdF8BkRxrFRzbwcp_aonFl5YO3u8iovSN0GpJgdQdyh6PhlLQmZjR9JLtOsdgGmcYocTuD50cao6wPUzS5i2BCv7izk8BbDamWoJ9bTVR1zq6rD2qDBFmpMYC9s28gYe4Bx10mbziQs1M7GHn76d-0zkERjgH-Vmn1cS2ZSd8AME2IlZ1qonZ4br_uhOui6iv6jHs0Zcwg4d491ckNAe5Gj8qPP4V2_ZMiTqmZhNpIn7w2E0jGGh4KFVOgXT-CVlWMK9Xidi9ZSZ3Eu7iydrmcCvWiOe6BtsVT5qiUIqLO1j5_1QkTBypo2qb8ZGKiODhKhnVM8U8ooVgt9hfAaF9WuklnnDq8k9qROsWI3t2tnhUlQjc0LURe0lSUksu1zb_y1?></g></svg>