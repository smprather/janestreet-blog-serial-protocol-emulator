<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:885px;height:1178px;background:#FFFFFF;" width="885px" height="1178px" viewBox="0 0 885 1178" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="152"><text x="185.801" y="29.966" fill="#000" font-size="14" textLength="512.398" font-weight="700" font-family="monospace">UART RTS/CTS — case 1: CTS held low for 400 us, then released</text></g><rect x="262.2" y="255.322" width="569.196" height="93.118" fill="none" style="stroke:#B0B0B0;stroke-width:1.5;"/><g><title>TB receiver</title><rect x="55.7" y="148.204" width="8" height="920.829" fill="#000" fill-opacity="0"/><line x1="59.2" y1="148.204" x2="59.2" y2="1069.032" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>CTS</title><rect x="274.7" y="148.204" width="8" height="920.829" fill="#000" fill-opacity="0"/><line x1="278.2" y1="148.204" x2="278.2" y2="1069.032" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>RTS</title><rect x="323.9" y="148.204" width="8" height="920.829" fill="#000" fill-opacity="0"/><line x1="327.4" y1="148.204" x2="327.4" y2="1069.032" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>TX</title><rect x="368.9" y="148.204" width="8" height="920.829" fill="#000" fill-opacity="0"/><line x1="372.4" y1="148.204" x2="372.4" y2="1069.032" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>master</title><rect x="703.9" y="148.204" width="8" height="920.829" fill="#000" fill-opacity="0"/><line x1="707.4" y1="148.204" x2="707.4" y2="1069.032" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title></title><rect x="702.4" y="187.91" width="10" height="325.06" fill="#FFF" style="stroke:#181818;stroke-width:1;"/></g><text x="10" y="125.034" fill="#000" font-size="14" textLength="92.4" font-family="monospace">TB receiver</text><text x="14.2" y="144.102" fill="#000" font-size="14" textLength="84" font-family="monospace">drives CTS</text><ellipse cx="59.2" cy="58.568" rx="8" ry="8" fill="#DCEEE0" style="stroke:#181818;stroke-width:0.5;"/><path d="M59.2,66.568 L59.2,93.568 M46.2,74.568 L72.2,74.568 M59.2,93.568 L46.2,108.568 M59.2,93.568 L72.2,108.568" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="258.6" y="114.136" width="39.2" height="33.068" fill="#FBE9CF" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="265.6" y="136.102" fill="#16324F" font-size="14" textLength="25.2" font-family="monospace">CTS</text><rect x="307.8" y="114.136" width="39.2" height="33.068" fill="#FBE9CF" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="314.8" y="136.102" fill="#16324F" font-size="14" textLength="25.2" font-family="monospace">RTS</text><rect x="357" y="114.136" width="30.8" height="33.068" fill="#EEF3FB" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="364" y="136.102" fill="#16324F" font-size="14" textLength="16.8" font-family="monospace">TX</text><text x="679.2" y="125.034" fill="#000" font-size="14" textLength="50.4" font-family="monospace">master</text><text x="666.6" y="144.102" fill="#000" font-size="14" textLength="75.6" font-family="monospace">poll loop</text><ellipse cx="707.4" cy="58.568" rx="8" ry="8" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;"/><path d="M707.4,66.568 L707.4,93.568 M694.4,74.568 L720.4,74.568 M707.4,93.568 L694.4,108.568 M707.4,93.568 L720.4,108.568" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="10" y="1083.998" fill="#000" font-size="14" textLength="92.4" font-family="monospace">TB receiver</text><text x="14.2" y="1103.066" fill="#000" font-size="14" textLength="84" font-family="monospace">drives CTS</text><ellipse cx="59.2" cy="1115.668" rx="8" ry="8" fill="#DCEEE0" style="stroke:#181818;stroke-width:0.5;"/><path d="M59.2,1123.668 L59.2,1150.668 M46.2,1131.668 L72.2,1131.668 M59.2,1150.668 L46.2,1165.668 M59.2,1150.668 L72.2,1165.668" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="258.6" y="1069.032" width="39.2" height="33.068" fill="#FBE9CF" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="265.6" y="1090.998" fill="#16324F" font-size="14" textLength="25.2" font-family="monospace">CTS</text><rect x="307.8" y="1069.032" width="39.2" height="33.068" fill="#FBE9CF" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="314.8" y="1090.998" fill="#16324F" font-size="14" textLength="25.2" font-family="monospace">RTS</text><rect x="357" y="1069.032" width="30.8" height="33.068" fill="#EEF3FB" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="364" y="1090.998" fill="#16324F" font-size="14" textLength="16.8" font-family="monospace">TX</text><text x="679.2" y="1083.998" fill="#000" font-size="14" textLength="50.4" font-family="monospace">master</text><text x="666.6" y="1103.066" fill="#000" font-size="14" textLength="75.6" font-family="monospace">poll loop</text><ellipse cx="707.4" cy="1115.668" rx="8" ry="8" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;"/><path d="M707.4,1123.668 L707.4,1150.668 M694.4,1131.668 L720.4,1131.668 M707.4,1150.668 L694.4,1165.668 M707.4,1150.668 L720.4,1165.668" style="stroke:#181818;stroke-width:0.5;" fill="none"/><polygon points="266.2,175.91,276.2,179.91,266.2,183.91,270.2,179.91" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="59.2" y1="179.91" x2="272.2" y2="179.91" style="stroke:#333;stroke-width:1;"/><text x="66.2" y="174.101" fill="#000" font-size="13" textLength="195" font-family="monospace">CTS LOW for 24,000 clocks</text><polygon points="338.4,207.616,328.4,211.616,338.4,215.616,334.4,211.616" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="332.4" y1="211.616" x2="701.4" y2="211.616" style="stroke:#333;stroke-width:1;"/><text x="344.4" y="205.807" fill="#000" font-size="13" textLength="351" font-family="monospace">RTS asserted FIRST, before CTS is read at all</text><polygon points="289.2,239.322,279.2,243.322,289.2,247.322,285.2,243.322" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="283.2" y1="243.322" x2="701.4" y2="243.322" style="stroke:#333;stroke-width:1;"/><text x="295.2" y="237.513" fill="#000" font-size="13" textLength="163.8" font-family="monospace">read CTS, find it LOW</text><path d="M262.2,255.322 L338.4,255.322 L338.4,265.028 L328.4,275.028 L262.2,275.028 L262.2,255.322" style="stroke:#B0B0B0;stroke-width:1.5;" fill="#FBFBFB"/><rect x="262.2" y="255.322" width="569.196" height="93.118" fill="none" style="stroke:#B0B0B0;stroke-width:1.5;"/><text x="277.2" y="270.219" fill="#000" font-size="13" textLength="31.2" font-weight="700" font-family="monospace">loop</text><text x="353.4" y="269.081" fill="#000" font-size="11" textLength="461.996" font-weight="700" font-family="monospace">[the wait — one iteration every six clocks, dmem[3] saturates at 0xFF]</text><polygon points="289.2,304.734,279.2,308.734,289.2,312.734,285.2,308.734" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="283.2" y1="308.734" x2="701.4" y2="308.734" style="stroke:#333;stroke-width:1;"/><text x="295.2" y="302.925" fill="#000" font-size="13" textLength="109.2" font-family="monospace">read CTS again</text><polygon points="690.4,336.44,700.4,340.44,690.4,344.44,694.4,340.44" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="278.2" y1="340.44" x2="696.4" y2="340.44" style="stroke:#333;stroke-width:1;stroke-dasharray:2,2;"/><text x="285.2" y="334.631" fill="#000" font-size="13" textLength="70.2" font-family="monospace">still LOW</text><polygon points="266.2,382.146,276.2,386.146,266.2,390.146,270.2,386.146" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="59.2" y1="386.146" x2="272.2" y2="386.146" style="stroke:#333;stroke-width:1;"/><text x="66.2" y="380.337" fill="#000" font-size="13" textLength="93.6" font-family="monospace">CTS released</text><polygon points="690.4,413.852,700.4,417.852,690.4,421.852,694.4,417.852" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="278.2" y1="417.852" x2="696.4" y2="417.852" style="stroke:#333;stroke-width:1;stroke-dasharray:2,2;"/><text x="285.2" y="412.043" fill="#000" font-size="13" textLength="163.8" font-family="monospace">HIGH — the wait exits</text><polygon points="338.4,445.558,328.4,449.558,338.4,453.558,334.4,449.558" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="332.4" y1="449.558" x2="701.4" y2="449.558" style="stroke:#333;stroke-width:1;"/><text x="344.4" y="443.749" fill="#000" font-size="13" textLength="319.8" font-family="monospace">first start bit, at or after the CTS rise</text><polygon points="383.4,477.264,373.4,481.264,383.4,485.264,379.4,481.264" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="377.4" y1="481.264" x2="701.4" y2="481.264" style="stroke:#333;stroke-width:1;"/><text x="389.4" y="475.455" fill="#000" font-size="13" textLength="202.8" font-family="monospace">0x00, then 0xFF, then 0xA5</text><polygon points="338.4,508.97,328.4,512.97,338.4,516.97,334.4,512.97" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="332.4" y1="512.97" x2="701.4" y2="512.97" style="stroke:#333;stroke-width:1;"/><text x="344.4" y="507.161" fill="#000" font-size="13" textLength="280.8" font-family="monospace">RTS released after the last stop bit</text><path d="M151,525.97 L151,712.97 L499,712.97 L499,535.97 L489,525.97 L151,525.97" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M489,525.97 L489,535.97 L499,535.97 L489,525.97" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="157" y="544.867" fill="#000" font-size="13" textLength="273" font-family="monospace">THE INVARIANT, CHECKED EVERY CLOCK:</text><text x="157" y="562.573" fill="#000" font-size="13" textLength="296.4" font-family="monospace">TX NEVER LEAVES IDLE WHILE CTS IS LOW.</text><text x="157" y="580.279" fill="#000" font-size="13" textLength="312" font-family="monospace">Not "the program eventually transmits" —</text><text x="157" y="597.985" fill="#000" font-size="13" textLength="312" font-family="monospace">a bare echo satisfies that. Not even "it</text><text x="157" y="615.691" fill="#000" font-size="13" textLength="327.6" font-family="monospace">waits for CTS before its first start bit",</text><text x="157" y="633.397" fill="#000" font-size="13" textLength="265.2" font-family="monospace">which a one-shot test satisfies by</text><text x="157" y="651.103" fill="#000" font-size="13" textLength="327.6" font-family="monospace">accident if the wait sits after the frame.</text><text x="157" y="668.809" fill="#000" font-size="13" textLength="304.2" font-family="monospace">The claim is about EVERY instant CTS is</text><text x="157" y="686.515" fill="#000" font-size="13" textLength="327.6" font-family="monospace">low, and it is the only one of the three a</text><text x="157" y="704.221" fill="#000" font-size="13" textLength="312" font-family="monospace">receiver with a full buffer can rely on.</text><path d="M157,723.03 L157,892.03 L497,892.03 L497,733.03 L487,723.03 L157,723.03" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M487,723.03 L487,733.03 L497,733.03 L487,723.03" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="163" y="741.927" fill="#000" font-size="13" textLength="288.6" font-family="monospace">RTS MUST BE HIGH FOR EVERY INSTANT TX</text><text x="163" y="759.633" fill="#000" font-size="13" textLength="319.8" font-family="monospace">IS NOT IDLE. TX low means this program is</text><text x="163" y="777.339" fill="#000" font-size="13" textLength="296.4" font-family="monospace">mid-frame, and RTS low at that instant</text><text x="163" y="795.045" fill="#000" font-size="13" textLength="319.8" font-family="monospace">tells the receiver the line is free while</text><text x="163" y="812.751" fill="#000" font-size="13" textLength="257.4" font-family="monospace">we are driving it — the failure a</text><text x="163" y="830.457" fill="#000" font-size="13" textLength="296.4" font-family="monospace">"release RTS when the buffer is empty"</text><text x="163" y="848.163" fill="#000" font-size="13" textLength="312" font-family="monospace">implementation makes, and invisible to a</text><text x="163" y="865.869" fill="#000" font-size="13" textLength="296.4" font-family="monospace">check that only compares the first and</text><text x="163" y="883.575" fill="#000" font-size="13" textLength="210.6" font-family="monospace">last edge of the handshake.</text><path d="M544.8,902.384 L544.8,1053.384 L869.8,1053.384 L869.8,912.384 L859.8,902.384 L544.8,902.384" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M859.8,902.384 L859.8,912.384 L869.8,912.384 L859.8,902.384" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="550.8" y="921.281" fill="#000" font-size="13" textLength="288.6" font-family="monospace">Measured: CTS released at 417.225 us;</text><text x="550.8" y="938.987" fill="#000" font-size="13" textLength="265.2" font-family="monospace">the three bytes decode at 499.874,</text><text x="550.8" y="956.693" fill="#000" font-size="13" textLength="280.8" font-family="monospace">585.853 and 672.517 us, i.e. a frame</text><text x="550.8" y="974.399" fill="#000" font-size="13" textLength="280.8" font-family="monospace">period of 85.98 and 86.66 us for ten</text><text x="550.8" y="992.105" fill="#000" font-size="13" textLength="304.2" font-family="monospace">cells. dmem[3] = 255 (saturated), which</text><text x="550.8" y="1009.811" fill="#000" font-size="13" textLength="304.2" font-family="monospace">is the non-vacuity half: a program that</text><text x="550.8" y="1027.517" fill="#000" font-size="13" textLength="280.8" font-family="monospace">never consulted CTS would leave it 0</text><text x="550.8" y="1045.223" fill="#000" font-size="13" textLength="249.6" font-family="monospace">and pass every other check here.</text><?plantuml-src TLLTR-9657tdLronBwr4N482-QXQYMN91cqW5NYpMxLz6EphC8ezGptZ4Dxw8_eB-qjwxjWGq6Q35F3CcVjnpfbhhttEz7auZsaUBtuQnGlwxvz_AL6EwVIQv7d5UKgvtL1cIphlTgbo7V8hDbHopW2cBVUapLgLgg2KCrNb_iOQFrC5qzGQwzOgEGBzfagl4xrMnhzNoTDZQIkJZcoE-E-OixDi-HsmBLCk6-2v6cIg_pPGqZUmqy5PxpmxW2tuxufDmX-HTVrD-cmfd-_23mjOTkLp01sMfTqqcsVXhzLIYSTZEtuFiXBMprp-QT8ItqwuRPDoDATtQSBCtTRwjGDgxxP7KXHV9TdnzhpPNhoz7NyDk_6kW48vBxdNDiyXfbs7xMchDQUJNv6Zblhk_ajGkNVUwKBe9BV9avCG-bbvYDcQ2de1DD8ZWEFISqeta_aYxj2ISPP38EtGhqf9UL9vNX-J964HW0vbsgIalQHiIJtYADeeh8Z_h65iSgcyjeOOj6t9wPUceWwb1HT_dFr5JlaA8B29JDsNcviMqJV9I3qgRR0peXDiJR7bl0OFafjDUip1tjIlwDl9nzjGrhv6Vj7UlRAHwT9v18K2jDI-8zM0HfMXXN0e1DQEwoCnZdHVkjtc6adT-v_3_Z79kt8EWkKg90DdoDLA-K0VO_5bGHUDEX2VABuTqsJsC9nFXZD8DBeTZpwDFz3uOJp_dKPtzwDFruBwIZDPehlny66yeCc7kp5zkPtWlrG-2Sw809nPU4jgM9VsKJmFQOoleF6MVAcCAy1BMxW2MD5ImG-ShAm8fLsc8PHVAH-5G7AMscY10gakM4_oDKOAIyVCjZi2NkbaXUWmoObR8H3qzmSPbbj9dYGwHMsairVPd8Hy9J931onjnNX8SgKBCQvQsiet36c3r0XIUnf8p46eMrjNkn356ZGlXhLr9hygcKa1lBlojD5U2iugc6vPPHcM4XNcfvoCn8GaqXtejy1vqN_wUH7J-t7jmPlxULFOPBQ8eIYK0mxwpExZe5eaMigmBXXge1OKkTCgD53ez2JqNRSXAGGEmuemkuO1z9pdTOFxDeBvj5nD22DDGecSHH7q2y5ai6dpICqb3XGhdLTbJKUxyN98kX6x2wBX0o6vMFjj6q1Th7Ck85vz_GlrnAvXtJnhfvTuPNaROYOhJfxgqeCEYIqm1xakl3OFpebmScauVTpBjCAwMo7qc_HFPP2WMDIU7iy5eUhyz2BgzVfu4_uiJEr5Nsvb5AMSs9G3xkegkhmu5zFsB_lHPVyiT36uw4Nzqulm8jKHHs8DaGImDPVQfb8Zy5UN0NuvY0O3WCFzy2oJB15nelqO_8Lw_Jxzi9k6wO-T-f88bpKLnfgJPvLKsc_HUPvT8-VE5y8Ua4R6B0Wq3YzmhYVdn