<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:854px;height:1146px;background:#FFFFFF;" width="854px" height="1146px" viewBox="0 0 854 1146" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="147"><text x="170.201" y="29.966" fill="#000" font-size="14" textLength="512.398" font-weight="700" font-family="monospace">UART RTS/CTS — case 1: CTS held low for 400 us, then released</text></g><rect x="262.2" y="223.616" width="569.196" height="93.118" fill="none" style="stroke:#B0B0B0;stroke-width:1.5;"/><g><title>TB receiver</title><rect x="55.7" y="148.204" width="8" height="889.123" fill="#000" fill-opacity="0"/><line x1="59.2" y1="148.204" x2="59.2" y2="1037.326" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>CTS</title><rect x="274.7" y="148.204" width="8" height="889.123" fill="#000" fill-opacity="0"/><line x1="278.2" y1="148.204" x2="278.2" y2="1037.326" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>RTS</title><rect x="323.9" y="148.204" width="8" height="889.123" fill="#000" fill-opacity="0"/><line x1="327.4" y1="148.204" x2="327.4" y2="1037.326" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>TX</title><rect x="368.9" y="148.204" width="8" height="889.123" fill="#000" fill-opacity="0"/><line x1="372.4" y1="148.204" x2="372.4" y2="1037.326" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>master</title><rect x="672.7" y="148.204" width="8" height="889.123" fill="#000" fill-opacity="0"/><line x1="676.2" y1="148.204" x2="676.2" y2="1037.326" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title></title><rect x="671.2" y="187.91" width="10" height="293.354" fill="#FFF" style="stroke:#181818;stroke-width:1;"/></g><text x="10" y="125.034" fill="#000" font-size="14" textLength="92.4" font-family="monospace">TB receiver</text><text x="14.2" y="144.102" fill="#000" font-size="14" textLength="84" font-family="monospace">drives CTS</text><ellipse cx="59.2" cy="58.568" rx="8" ry="8" fill="#DCEEE0" style="stroke:#181818;stroke-width:0.5;"/><path d="M59.2,66.568 L59.2,93.568 M46.2,74.568 L72.2,74.568 M59.2,93.568 L46.2,108.568 M59.2,93.568 L72.2,108.568" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="258.6" y="114.136" width="39.2" height="33.068" fill="#FBE9CF" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="265.6" y="136.102" fill="#16324F" font-size="14" textLength="25.2" font-family="monospace">CTS</text><rect x="307.8" y="114.136" width="39.2" height="33.068" fill="#FBE9CF" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="314.8" y="136.102" fill="#16324F" font-size="14" textLength="25.2" font-family="monospace">RTS</text><rect x="357" y="114.136" width="30.8" height="33.068" fill="#EEF3FB" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="364" y="136.102" fill="#16324F" font-size="14" textLength="16.8" font-family="monospace">TX</text><text x="648" y="125.034" fill="#000" font-size="14" textLength="50.4" font-family="monospace">master</text><text x="635.4" y="144.102" fill="#000" font-size="14" textLength="75.6" font-family="monospace">poll loop</text><ellipse cx="676.2" cy="58.568" rx="8" ry="8" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;"/><path d="M676.2,66.568 L676.2,93.568 M663.2,74.568 L689.2,74.568 M676.2,93.568 L663.2,108.568 M676.2,93.568 L689.2,108.568" style="stroke:#181818;stroke-width:0.5;" fill="none"/><text x="10" y="1052.292" fill="#000" font-size="14" textLength="92.4" font-family="monospace">TB receiver</text><text x="14.2" y="1071.36" fill="#000" font-size="14" textLength="84" font-family="monospace">drives CTS</text><ellipse cx="59.2" cy="1083.962" rx="8" ry="8" fill="#DCEEE0" style="stroke:#181818;stroke-width:0.5;"/><path d="M59.2,1091.962 L59.2,1118.962 M46.2,1099.962 L72.2,1099.962 M59.2,1118.962 L46.2,1133.962 M59.2,1118.962 L72.2,1133.962" style="stroke:#181818;stroke-width:0.5;" fill="none"/><rect x="258.6" y="1037.326" width="39.2" height="33.068" fill="#FBE9CF" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="265.6" y="1059.292" fill="#16324F" font-size="14" textLength="25.2" font-family="monospace">CTS</text><rect x="307.8" y="1037.326" width="39.2" height="33.068" fill="#FBE9CF" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="314.8" y="1059.292" fill="#16324F" font-size="14" textLength="25.2" font-family="monospace">RTS</text><rect x="357" y="1037.326" width="30.8" height="33.068" fill="#EEF3FB" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="364" y="1059.292" fill="#16324F" font-size="14" textLength="16.8" font-family="monospace">TX</text><text x="648" y="1052.292" fill="#000" font-size="14" textLength="50.4" font-family="monospace">master</text><text x="635.4" y="1071.36" fill="#000" font-size="14" textLength="75.6" font-family="monospace">poll loop</text><ellipse cx="676.2" cy="1083.962" rx="8" ry="8" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;"/><path d="M676.2,1091.962 L676.2,1118.962 M663.2,1099.962 L689.2,1099.962 M676.2,1118.962 L663.2,1133.962 M676.2,1118.962 L689.2,1133.962" style="stroke:#181818;stroke-width:0.5;" fill="none"/><polygon points="266.2,175.91,276.2,179.91,266.2,183.91,270.2,179.91" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="59.2" y1="179.91" x2="272.2" y2="179.91" style="stroke:#333;stroke-width:1;"/><text x="66.2" y="174.101" fill="#000" font-size="13" textLength="195" font-family="monospace">CTS LOW for 24,000 clocks</text><polygon points="289.2,207.616,279.2,211.616,289.2,215.616,285.2,211.616" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="283.2" y1="211.616" x2="670.2" y2="211.616" style="stroke:#333;stroke-width:1;"/><text x="295.2" y="205.807" fill="#000" font-size="13" textLength="163.8" font-family="monospace">read CTS, find it LOW</text><path d="M262.2,223.616 L338.4,223.616 L338.4,233.322 L328.4,243.322 L262.2,243.322 L262.2,223.616" style="stroke:#B0B0B0;stroke-width:1.5;" fill="#FBFBFB"/><rect x="262.2" y="223.616" width="569.196" height="93.118" fill="none" style="stroke:#B0B0B0;stroke-width:1.5;"/><text x="277.2" y="238.513" fill="#000" font-size="13" textLength="31.2" font-weight="700" font-family="monospace">loop</text><text x="353.4" y="237.375" fill="#000" font-size="11" textLength="461.996" font-weight="700" font-family="monospace">[the wait — one iteration every six clocks, dmem[3] saturates at 0xFF]</text><polygon points="289.2,273.028,279.2,277.028,289.2,281.028,285.2,277.028" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="283.2" y1="277.028" x2="670.2" y2="277.028" style="stroke:#333;stroke-width:1;"/><text x="295.2" y="271.219" fill="#000" font-size="13" textLength="109.2" font-family="monospace">read CTS again</text><polygon points="659.2,304.734,669.2,308.734,659.2,312.734,663.2,308.734" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="278.2" y1="308.734" x2="665.2" y2="308.734" style="stroke:#333;stroke-width:1;stroke-dasharray:2,2;"/><text x="285.2" y="302.925" fill="#000" font-size="13" textLength="70.2" font-family="monospace">still LOW</text><polygon points="266.2,350.44,276.2,354.44,266.2,358.44,270.2,354.44" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="59.2" y1="354.44" x2="272.2" y2="354.44" style="stroke:#333;stroke-width:1;"/><text x="66.2" y="348.631" fill="#000" font-size="13" textLength="93.6" font-family="monospace">CTS released</text><polygon points="659.2,382.146,669.2,386.146,659.2,390.146,663.2,386.146" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="278.2" y1="386.146" x2="665.2" y2="386.146" style="stroke:#333;stroke-width:1;stroke-dasharray:2,2;"/><text x="285.2" y="380.337" fill="#000" font-size="13" textLength="163.8" font-family="monospace">HIGH — the wait exits</text><polygon points="338.4,413.852,328.4,417.852,338.4,421.852,334.4,417.852" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="332.4" y1="417.852" x2="670.2" y2="417.852" style="stroke:#333;stroke-width:1;"/><text x="344.4" y="412.043" fill="#000" font-size="13" textLength="319.8" font-family="monospace">first start bit, at or after the CTS rise</text><polygon points="383.4,445.558,373.4,449.558,383.4,453.558,379.4,449.558" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="377.4" y1="449.558" x2="670.2" y2="449.558" style="stroke:#333;stroke-width:1;"/><text x="389.4" y="443.749" fill="#000" font-size="13" textLength="202.8" font-family="monospace">0x00, then 0xFF, then 0xA5</text><polygon points="338.4,477.264,328.4,481.264,338.4,485.264,334.4,481.264" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="332.4" y1="481.264" x2="670.2" y2="481.264" style="stroke:#333;stroke-width:1;"/><text x="344.4" y="475.455" fill="#000" font-size="13" textLength="280.8" font-family="monospace">RTS released after the last stop bit</text><path d="M151,494.264 L151,681.264 L499,681.264 L499,504.264 L489,494.264 L151,494.264" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M489,494.264 L489,504.264 L499,504.264 L489,494.264" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="157" y="513.161" fill="#000" font-size="13" textLength="273" font-family="monospace">THE INVARIANT, CHECKED EVERY CLOCK:</text><text x="157" y="530.867" fill="#000" font-size="13" textLength="296.4" font-family="monospace">TX NEVER LEAVES IDLE WHILE CTS IS LOW.</text><text x="157" y="548.573" fill="#000" font-size="13" textLength="312" font-family="monospace">Not "the program eventually transmits" —</text><text x="157" y="566.279" fill="#000" font-size="13" textLength="312" font-family="monospace">a bare echo satisfies that. Not even "it</text><text x="157" y="583.985" fill="#000" font-size="13" textLength="327.6" font-family="monospace">waits for CTS before its first start bit",</text><text x="157" y="601.691" fill="#000" font-size="13" textLength="265.2" font-family="monospace">which a one-shot test satisfies by</text><text x="157" y="619.397" fill="#000" font-size="13" textLength="327.6" font-family="monospace">accident if the wait sits after the frame.</text><text x="157" y="637.103" fill="#000" font-size="13" textLength="304.2" font-family="monospace">The claim is about EVERY instant CTS is</text><text x="157" y="654.809" fill="#000" font-size="13" textLength="327.6" font-family="monospace">low, and it is the only one of the three a</text><text x="157" y="672.515" fill="#000" font-size="13" textLength="312" font-family="monospace">receiver with a full buffer can rely on.</text><path d="M157,691.324 L157,860.324 L497,860.324 L497,701.324 L487,691.324 L157,691.324" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M487,691.324 L487,701.324 L497,701.324 L487,691.324" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="163" y="710.221" fill="#000" font-size="13" textLength="288.6" font-family="monospace">RTS MUST BE HIGH FOR EVERY INSTANT TX</text><text x="163" y="727.927" fill="#000" font-size="13" textLength="319.8" font-family="monospace">IS NOT IDLE. TX low means this program is</text><text x="163" y="745.633" fill="#000" font-size="13" textLength="296.4" font-family="monospace">mid-frame, and RTS low at that instant</text><text x="163" y="763.339" fill="#000" font-size="13" textLength="319.8" font-family="monospace">tells the receiver the line is free while</text><text x="163" y="781.045" fill="#000" font-size="13" textLength="257.4" font-family="monospace">we are driving it — the failure a</text><text x="163" y="798.751" fill="#000" font-size="13" textLength="296.4" font-family="monospace">"release RTS when the buffer is empty"</text><text x="163" y="816.457" fill="#000" font-size="13" textLength="312" font-family="monospace">implementation makes, and invisible to a</text><text x="163" y="834.163" fill="#000" font-size="13" textLength="296.4" font-family="monospace">check that only compares the first and</text><text x="163" y="851.869" fill="#000" font-size="13" textLength="210.6" font-family="monospace">last edge of the handshake.</text><path d="M513.6,870.678 L513.6,1021.678 L838.6,1021.678 L838.6,880.678 L828.6,870.678 L513.6,870.678" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M828.6,870.678 L828.6,880.678 L838.6,880.678 L828.6,870.678" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="519.6" y="889.575" fill="#000" font-size="13" textLength="288.6" font-family="monospace">Measured: CTS released at 417.225 us;</text><text x="519.6" y="907.281" fill="#000" font-size="13" textLength="265.2" font-family="monospace">the three bytes decode at 499.874,</text><text x="519.6" y="924.987" fill="#000" font-size="13" textLength="280.8" font-family="monospace">585.853 and 672.517 us, i.e. a frame</text><text x="519.6" y="942.693" fill="#000" font-size="13" textLength="280.8" font-family="monospace">period of 85.98 and 86.66 us for ten</text><text x="519.6" y="960.399" fill="#000" font-size="13" textLength="304.2" font-family="monospace">cells. dmem[3] = 255 (saturated), which</text><text x="519.6" y="978.105" fill="#000" font-size="13" textLength="304.2" font-family="monospace">is the non-vacuity half: a program that</text><text x="519.6" y="995.811" fill="#000" font-size="13" textLength="280.8" font-family="monospace">never consulted CTS would leave it 0</text><text x="519.6" y="1013.517" fill="#000" font-size="13" textLength="249.6" font-family="monospace">and pass every other check here.</text><?plantuml-src TLNRSk9647tdAxhObwGAAnWRV4abLPZ5QseDJe7Mkwaa3uFKCbEMPbZDo9YtV4I-C5-IqoE1STOBLI2fp_JbdEwMrpvd-ZISnpIF5p-DuWNz-_S_b2Z7T7n9Sh_YFANSRYYp9PrskrIv3laL6oevPm3JbdlKPgrALL3AcQfoVssDdwc2QMgDTMkLl0Bzfagl4xrMnb-fvF6Xj9L9HpQ7_tVCsKcs_0xObYcN3V1K3JBLVnieuHlOyU2aTveTm1RyjMAJy0T4NNyJFblAzxlmmmIMNVaUG8TbQJUDyIHyMYsLUDosuokGbR1-ul9FavRuTy9jcvIZERrB4sRkjjOl5L1xPnv9KdoHPA_DyyQyUDiSVmdMU9T0ePoNs6kRvn3JheDvschDwUXNnAYblhtx75JkdNQw43h9RVBen8L-KXvYjgOxTCagbICTohH9INivsnB7qXgqKNWYZMGDmyYbyjeQOjI_9QUV6zSTIWik_ZZvYvpo5K2WHNdgFbzVjuY-2KRgGMa3ouYEO9h2vBn6GHARJVgwc7rtlg1l9XzkGbhx7FbPUrUNjG0WqwNpS0egQQbzHx817of32U5GSAmTrqTY7Ea-TxlDF4ZU-yjX_yNj_22T0sUv2i706MArKZuWsbZyMT15emvK98flnZIPtG_da-4ixj3ePZpwE7vFu_ln_7SQtTwDFbuAwWlDv17TZeVtumLDtj-EwVFD1B-I-IH8704uisWIoM5TsWTfNaXZVANoV4k-LCOLuAKjN06iQAbA9avMLeJIBjCGog-KZu8ZEKjjb421L1TwIE8j6LVI0Ex_pBOx0bxfP0NlQ98Zju8ZwEyF8Yot4Zn9T8hSI6SliZbn-K9aXWfOoefna-HA5wHXNzhADmnfWz1m8bbf1oGM6jIjMrUxuCKQ52yDQ-j8VbKoam9uDxkqqLuIpYeqtRBACZnAL5Y4SZAI9YIHxa2_1SwB_jDFYvYkndKFNj_DcyGciqKCHQ4SSD1dTXS7rIBHKhPkmL03kI39dLQXW4AdHw7kkWm98N0qh0YpAnX0ptbU5xWl8pIVbj64C58abCXP546z44msb3OFr0nne5Zfl2fhEjfDBuUW6sbtGJHym2KNQxzj0wYBTSu5nAl7lr2Fx1hMpPDsUebtZxV1PxBYvB5EFUYGs08BZUl4w-R1EH5EXeRJXxrCApntAxX-a_wfB18aYzpJrtj1g3ezFejwlJvUQJyBKtlHbrjPHIadDkM0kxY8pizEfMdxv_tel7yIgXYSzQB-yLbu8-g88saDaGImDPVQff8Zy1Vd0Nu-Y0O3WCDyU9PDbeWuqNuD_aAzVfz-s6t3zCTEFIJ2PKs5iUReIIMLzbjKdcUNYBdh2s4FI2Dh5WGQXpSnrvjpOojvYxDwad6ahWmMCbehvvgjRE6zR6J0rG6R_m40?></g></svg>