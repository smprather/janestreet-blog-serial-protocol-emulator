t bit</text><path d="M52.1,345.666 L52.1,478.666 L416.1,478.666 L416.1,355.666 L406.1,345.666 L52.1,345.666" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M406.1,345.666 L406.1,355.666 L416.1,355.666 L406.1,345.666" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="58.1" y="364.563" fill="#000" font-size="13" textLength="343.2" font-family="monospace">LSB FIRST, so d0 is bit 0. 0x90 = 1001 0000:</text><text x="58.1" y="382.269" fill="#000" font-size="13" textLength="265.2" font-family="monospace">the status byte is two nibbles - a</text><text x="58.1" y="399.975" fill="#000" font-size="13" textLength="280.8" font-family="monospace">message type and a channel - and the</text><text x="58.1" y="417.681" fill="#000" font-size="13" textLength="273" font-family="monospace">top bit being set is what makes the</text><text x="58.1" y="435.387" fill="#000" font-size="13" textLength="249.6" font-family="monospace">wire self-delimiting: a receiver</text><text x="58.1" y="453.093" fill="#000" font-size="13" textLength="288.6" font-family="monospace">decides "status or data" from the top</text><text x="58.1" y="470.799" fill="#000" font-size="13" textLength="78" font-family="monospace">bit alone.</text><?plantuml-src TLJRZjCm47ttLupA0o2rbPFqegq44WiigWG8iVo04q-sLXCxQpkqVUCZ-CBz4iPsLcG3spnqSkRCxNWShto3y6N_OGyFltw3qGZbnICe1nurLDWqRWv2In3GedFYBlaE5X5CJGQsyChO69bezxsm7krhvevATyAA5YJMec_yZT7-gsYfdj76TQ92EI9zep1LgKveVosguvqrlPRlJKF9No3MHLq-GpPMeXs8Ax6fnVh_n51-e6MR8b_L8zejtlUeA_n4LRj_ojTbU9wbZnieUNX6r7VMcjFWBEAFiUvlKp1pdjvc81mu_zGZUOGbdy1PWhC9d2Sudy15Wei9l4hmQWAl4xoUm9i4RoRmDi7RwKIcImDrJnqQpsbIVMPC6zepynCjpJqF280xc9FU0JzVyNbOBGYSXT744BvtSJNdu91o6L8VX8SMtW1VKkn7odI92niMDBlAELIDgOwE24M-v9n3Jwli3AteiE8KLUHySCNj3JMBR9cluLYANi99MOHAMAimikSPkKAqWouqZfNHSicGGaEhp7bOl0q79daqCYQpQEHCvj4ec2oYiM9o5Oqra-jeR9ZSH6FBv3OO99_hWg7Fi8EIjXAyYV-xf0x92JKj6RuCoqDAGwdyI5X9Cb8sWC-trt2p_txx8mf0pP54H2NbejWaKSPv1gG4tn4z91z97c_yoO1MPTdGw0iGH7hy7FXBztZrguFG6fj0I6A6NAQBfKfK-euKyo7Rw