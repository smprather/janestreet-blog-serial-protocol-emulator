<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:905px;height:747px;background:#FFFFFF;" width="905px" height="747px" viewBox="0 0 905 747" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="164"><text x="94.701" y="29.966" fill="#000" font-size="14" textLength="713.997" font-weight="700" font-family="monospace">SPI mode 3 — the two edges are the protocol, and they are the same in both directions</text></g><g><title>master</title><rect x="34.7" y="129.136" width="8" height="527.826" fill="#000" fill-opacity="0"/><line x1="38.2" y1="129.136" x2="38.2" y2="656.962" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>SCLK</title><rect x="323.9" y="129.136" width="8" height="527.826" fill="#000" fill-opacity="0"/><line x1="327.4" y1="129.136" x2="327.4" y2="656.962" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>MOSI</title><rect x="464.3" y="129.136" width="8" height="527.826" fill="#000" fill-opacity="0"/><line x1="467.8" y1="129.136" x2="467.8" y2="656.962" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>MISO</title><rect x="593.299" y="129.136" width="8" height="527.826" fill="#000" fill-opacity="0"/><line x1="596.799" y1="129.136" x2="596.799" y2="656.962" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>slave</title><rect x="866.899" y="129.136" width="8" height="527.826" fill="#000" fill-opacity="0"/><line x1="870.399" y1="129.136" x2="870.399" y2="656.962" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><text x="10" y="125.034" fill="#000" font-size="14" textLength="50.4" font-family="monospace">master</text><ellipse cx="38.2" cy="58.568" rx="8" ry="8" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;"/>