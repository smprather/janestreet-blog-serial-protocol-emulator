#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="310.6" y="678.928" fill="#16324F" font-size="14" textLength="33.6" font-family="monospace">SCLK</text><rect x="406.2" y="656.962" width="123.2" height="52.136" fill="#EEF3FB" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="451" y="678.928" fill="#16324F" font-size="14" textLength="33.6" font-family="monospace">MOSI</text><text x="413.2" y="697.996" fill="#16324F" font-size="14" textLength="109.2" font-family="monospace">master drives</text><rect x="539.4" y="656.962" width="114.8" height="52.136" fill="#EEF3FB" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="579.999" y="678.928" fill="#16324F" font-size="14" textLength="33.6" font-family="monospace">MISO</text><text x="546.4" y="697.996" fill="#16324F" font-size="14" textLength="100.8" font-family="monospace">slave drives</text><text x="846.399" y="671.928" fill="#000" font-size="14" textLength="42" font-family="monospace">slave</text><ellipse cx="870.399" cy="684.53" rx="8" ry="8" fill="#DCEEE0" style="stroke:#181818;stroke-width:0.5;"/><path d="M870.399,692.53 L870.399,719.53 M857.399,700.53 L883.399,700.53 M870.399,719.53 L857.399,734.53 M870.399,719.53 L883.399,734.53" style="stroke:#181818;stroke-width:0.5;" fill="none"/><polygon points="315.4,156.842,325.4,160.842,315.4,164.842,319.4,160.842" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="38.2" y1="160.842" x2="321.4" y2="160.842" style="stroke:#333;stroke-width:1;"/><text x="45.2" y="155.033" fill="#000" font-size="13" textLength="179.4" font-family="monospace">SCLK HIGH (mode 3 idle)</text><polygon points="455.8,188.548,465.8,192.548,455.8,196.548,459.8,192.548" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="38.2" y1="192.548" x2="461.8" y2="192.548" style="stroke:#333;stroke-width:1;"/><text x="45.2" y="186.739" fill="#000" font-size="13" textLength="405.6" font-family="monospace">launch bit k  — data changes while the clock is HIGH</text><polygon points="315.4,220.254,325.4,224.254,315.4,228.254,319.4,224.254" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="38.2" y1="224.254" x2="321.4" y2="224.254" style="stroke:#333;stroke-width:1;"/><text x="45.2" y="218.445" fill="#000" font-size="13" textLength="78" font-family="monospace">SCLK FALLS</text><polygon points="607.799,251.96,597.799,255.96,607.799,259.96,603.799,255.96" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="601.799" y1="255.96" x2="869.399" y2="255.96" style="stroke:#333;stroke-width:1;"/><text x="613.799" y="250.151" fill="#000" font-size="13" textLength="249.6" font-family="monospace">the only instant MISO may change</text><polygon points="315.4,283.666,325.4,287.666,315.4,291.666,319.4,287.666" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="38.2" y1="287.666" x2="321.4" y2="287.666" style="stroke:#333;stroke-width:1;"/><text x="45.2" y="281.857" fill="#000" font-size="13" textLength="265.2" font-family="monospace">SCLK RISES  (one TIMER tick later)</text><polygon points="478.8,315.372,468.8,319.372,478.8,323.372,474.8,319.372" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="472.8" y1="319.372" x2="869.399" y2="319.372" style="stroke:#333;stroke-width:1;"/><text x="484.8" y="313.563" fill="#000" font-size="13" textLength="218.4" font-family="monospace">the slave CAPTURES MOSI here</text><polygon points="584.799,347.078,594.799,351.078,584.799,355.078,588.799,351.078" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="38.2" y1="351.078" x2="590.799" y2="351.078" style="stroke:#333;stroke-width:1;"/><text x="45.2" y="345.269" fill="#000" font-size="13" textLength="218.4" font-family="monospace">the master SAMPLES MISO here</text><path d="M358,364.078 L358,497.078 L706,497.078 L706,374.078 L696,364.078 L358,364.078" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M696,364.078 L696,374.078 L706,374.078 L696,364.078" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="364" y="382.975" fill="#000" font-size="13" textLength="273" font-family="monospace">MOSI MUST NOT MOVE WHILE SCL IS LOW</text><text x="364" y="400.681" fill="#000" font-size="13" textLength="280.8" font-family="monospace">MISO MUST NOT MOVE WHILE SCL IS HIGH</text><text x="364" y="418.387" fill="#000" font-size="13" textLength="312" font-family="monospace">Two counters in the TB, both asserted 0.</text><text x="364" y="436.093" fill="#000" font-size="13" textLength="327.6" font-family="monospace">They are the checks a mode-0 program fails</text><text x="364" y="453.799" fill="#000" font-size="13" textLength="312" font-family="monospace">even when the decoded bytes happen to be</text><text x="364" y="471.505" fill="#000" font-size="13" textLength="312" font-family="monospace">right — which is exactly the case a byte</text><text x="364" y="489.211" fill="#000" font-size="13" textLength="171.6" font-family="monospace">comparison cannot see.</text><path d="M141.4,508.02 L141.4,641.02 L512.4,641.02 L512.4,518.02 L502.4,508.02 L141.4,508.02" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M502.4,508.02 L502.4,518.02 L512.4,518.02 L502.4,508.02" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="147.4" y="526.917" fill="#000" font-size="13" textLength="351" font-family="monospace">IDLE LEVEL ALONE DOES NOT SEPARATE THE MODES.</text><text x="147.4" y="544.623" fill="#000" font-size="13" textLength="327.6" font-family="monospace">Reset already drives the output register's</text><text x="147.4" y="562.329" fill="#000" font-size="13" textLength="335.4" font-family="monospace">bit 0 HIGH, which is mode 3's idle clock by</text><text x="147.4" y="580.035" fill="#000" font-size="13" textLength="304.2" font-family="monospace">coincidence and mode 0's ACTIVE edge by</text><text x="147.4" y="597.741" fill="#000" font-size="13" textLength="351" font-family="monospace">construction. The property that does separate</text><text x="147.4" y="615.447" fill="#000" font-size="13" textLength="343.2" font-family="monospace">them is an EDGE: in mode 3 SCLK must make no</text><text x="147.4" y="633.153" fill="#000" font-size="13" textLength="304.2" font-family="monospace">falling edge at all while CS_N is high.</text><?plantuml-src VPJ1JXin48RlUOeH7029ehHGfFPGAOG5LjsmKNOBbqgLOyzchMpihUs4vjQ7w1FsIJhZNKfAIxEds9zdnl_yuw13Wr1CKrXPXN0AFx__W50ZX0SBg1ReGJYCAwspmKhR78CmYbUslxUyM25e0tCRQb3QeGpQ6Z_mIsrQuSGA55PYtOGhQy8jmnDhh6-5HBK3JOKBMkfMc70Xv7BXxDgeiMsiWtt4whIQlm1Rfz3ru9auhyJRVuESliTUdv--EQjsi0A_hj58lAQixL_fgpb_B-Ax1So7_EsW8-ViGxzv6d-3WP21_kwjX0_eza1uc0pQfq9XhnXd7-Fwc9FZErdzkJ_9Y_IpwSw3Sdg3FkBvComjyi_6DsA3krJwM43SYKi5x2k9YCF1O0AlFb3Uzy15m4rwVGE7lJsqQl2e0t826h4sieQv3h24w1qbWW1P2yFMUQXrqpb4DbOkGViOxLc2gr6M5OE2rr9QOzoQPak6ye4lmNU0bTZsOP-TdgL5KW0SMeDGffDa1dJx9LL6mXnrKVC-QYV3U3GjFyte34i8DRe-ucFkNjDYD9bcJ77sI1aRgB8DxUN7f21q0IQVYX9kyvB-tILmVvDc2HS6QG5PViyK1_WF5HK1A6dW93cESdkU9Iwbl3ZkPafuZowWWk49exkp9skKIvhIEC2lXZoc2tPT9NJZ2SOD6ce4TX4LIi8KpBU1-bEBjkKD2tCarEb57M8NgN7KLceNVYEZK2zY9k6Hyl1HWgLTaTEqjuOs36a37l5aWFGsi50xQes9JY_fmbbobsGmolBR12vpqfO5APBfQ3Og4oXl4bBdCYduYZFq640q3eNQzixjdB4ExJg0muNcDXtm5Tb-mwZZyLFbdM4FVBHixx_vDXQkZTIAXpU-P14S4ZWQboarXr-zHv8SwDRnCJjXrLdSbXh1UeW0ob9H7ddAeoHKtufJ2mF9vNNodjlOpqsqwchj0zbhYQGGuPLe6cqMNKB1jstwYHaNNsuvK4qDUPBq5m00?></g></svg>