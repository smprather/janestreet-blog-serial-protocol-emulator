94,136.1,696.794,126.1,700.794,130.1,696.794" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="76.1" y1="696.794" x2="132.1" y2="696.794" style="stroke:#333;stroke-width:1;"/><text x="83.1" y="690.985" fill="#000" font-size="13" textLength="15.6" font-family="monospace">80</text><polygon points="469.9,724.5,479.9,728.5,469.9,732.5,473.9,728.5" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="138.1" y1="728.5" x2="475.9" y2="728.5" style="stroke:#333;stroke-width:1;"/><text x="145.1" y="722.691" fill="#000" font-size="13" textLength="319.8" font-family="monospace">0x80 REPLACES 0x90, it does not add to it</text><polygon points="126.1,756.206,136.1,760.206,126.1,764.206,130.1,760.206" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="76.1" y1="760.206" x2="132.1" y2="760.206" style="stroke:#333;stroke-width:1;"/><text x="83.1" y="754.397" fill="#000" font-size="13" textLength="15.6" font-family="monospace">23</text><polygon points="126.1,787.912,136.1,791.912,126.1,795.912,130.1,791.912" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="76.1" y1="791.912" x2="132.1" y2="791.912" style="stroke:#333;stroke-width:1;"/><text x="83.1" y="786.103" fill="#000" font-size="13" textLength="15.6" font-family="monospace">43</text><line x1="481.9" y1="823.618" x2="523.9" y2="823.618" style="stroke:#333;stroke-width:1;"/><line x1="523.9" y1="823.618" x2="523.9" y2="836.618" style="stroke:#333;stroke-width:1;"/><line x1="482.9" y1="836.618" x2="523.9" y2="836.618" style="stroke:#333;stroke-width:1;"/><polygon points="492.9,832.618,482.9,836.618,492.9,840.618,488.9,836.618" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="488.9" y="817.809" fill="#000" font-size="13" textLength="148.2" font-family="monospace">message 3: note OFF</text><path d="M60.1,862.618 L331.3,862.618 L331.3,872.324 L321.3,882.324 L60.1,882.324 L60.1,862.618" style="stroke:#B0B0B0;stroke-width:1.5;" fill="#FBFBFB"/><rect x="60.1" y="862.618" width="647.6" height="201.236" fill="none" style="stroke:#B0B0B0;stroke-width:1.5;"/><text x="75.1" y="877.515" fill="#000" font-size="13" textLength="226.2" font-weight="700" font-family="monospace">m = 4, 5  running status 0x80</text><polygon points="126.1,912.03,136.1,916.03,126.1,920.03,130.1,916.03" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="76.1" y1="916.03" x2="132.1" y2="916.03" style="stroke:#333;stroke-width:1;"/><text x="83.1" y="910.221" fill="#000" font-size="13" textLength="15.6" font-family="monospace">24</text><polygon points="126.1,943.736,136.1,947.736,126.1,951.736,130.1,947.736" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="76.1" y1="947.736" x2="132.1" y2="947.736" style="stroke:#333;stroke-width:1;"/><text x="83.1" y="941.927" fill="#000" font-size="13" textLength="15.6" font-family="monospace">44</text><polygon points="126.1,975.442,136.1,979.442,126.1,983.442,130.1,979.442" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="76.1" y1="979.442" x2="132.1" y2="979.442" style="stroke:#333;stroke-width:1;"/><text x="83.1" y="973.633" fill="#000" font-size="13" textLength="15.6" font-family="monospace">25</text><polygon points="126.1,1007.148,136.1,1011.148,126.1,1015.148,130.1,1011.148" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="76.1" y1="1011.148" x2="132.1" y2="1011.148" style="stroke:#333;stroke-width:1;"/><text x="83.1" y="1005.339" fill="#000" font-size="13" textLength="15.6" font-family="monospace">45</text><line x1="481.9" y1="1042.854" x2="523.9" y2="1042.854" style="stroke:#333;stroke-width:1;"/><line x1="523.9" y1="1042.854" x2="523.9" y2="1055.854" style="stroke:#333;stroke-width:1;"/><line x1="482.9" y1="1055.854" x2="523.9" y2="1055.854" style="stroke:#333;stroke-width:1;"/><polygon points="492.9,1051.854,482.9,1055.854,492.9,1059.854,488.9,1055.854" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="488.9" y="1037.045" fill="#000" font-size="13" textLength="202.8" font-family="monospace">messages 4 and 5: note OFF</text><path d="M15,1082.854 L15,1393.854 L542,1393.854 L542,1092.854 L532,1082.854 L15,1082.854" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M532,1082.854 L532,1092.854 L542,1092.854 L532,1082.854" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="21" y="1101.751" fill="#000" font-size="13" textLength="444.6" font-family="monospace">SIX MESSAGES COST EIGHTEEN BYTES if every one repeats its</text><text x="21" y="1119.457" fill="#000" font-size="13" textLength="499.2" font-family="monospace">status byte, and fourteen with running status. The saving is the</text><text x="21" y="1137.163" fill="#000" font-size="13" textLength="475.8" font-family="monospace">point of the feature: a 31.25 kbaud wire saturates near 3,900</text><text x="21" y="1154.869" fill="#000" font-size="13" textLength="452.4" font-family="monospace">bytes per second and the status bytes are a fifth of them.</text><text x="21" y="1172.575" fill="#000" font-size="13" font-family="monospace"> </text><text x="21" y="1190.281" fill="#000" font-size="13" textLength="483.6" font-family="monospace">THE PART THAT IS EASY TO GET WRONG, and which the TB checks: a</text><text x="21" y="1207.987" fill="#000" font-size="13" textLength="491.4" font-family="monospace">receiver that KEPT 0x90 after seeing 0x80 would decode messages</text><text x="21" y="1225.693" fill="#000" font-size="13" textLength="429" font-family="monospace">4 and 5 as note-ONS - six messages, the right notes and</text><text x="21" y="1243.399" fill="#000" font-size="13" textLength="436.8" font-family="monospace">velocities, and the wrong direction on half of them. The</text><text x="21" y="1261.105" fill="#000" font-size="13" textLength="507" font-family="monospace">firmware sends 0x80 exactly once, at m = 3, and the TB's expected</text><text x="21" y="1278.811" fill="#000" font-size="13" textLength="265.2" font-family="monospace">list puts messages 4-6 under 0x80.</text><text x="21" y="1296.517" fill="#000" font-size="13" font-family="monospace"> </text><text x="21" y="1314.223" fill="#000" font-size="13" textLength="444.6" font-family="monospace">AND THE SAVING IS ASSERTED, NOT INFERRED: a firmware that</text><text x="21" y="1331.929" fill="#000" font-size="13" textLength="483.6" font-family="monospace">repeated the status byte would still decode into the right six</text><text x="21" y="1349.635" fill="#000" font-size="13" textLength="475.8" font-family="monospace">messages under a receiver that ignored running status, so the</text><text x="21" y="1367.341" fill="#000" font-size="13" textLength="460.2" font-family="monospace">byte count is checked directly - exactly 2 status bytes and</text><text x="21" y="1385.047" fill="#000" font-size="13" textLength="382.2" font-family="monospace">exactly 14 bytes on the wire, against 6 messages.</text><?plantuml-src TLN1Rk984Btp5QNCOIyG6HiYWhGhaSHXq2uGOMkPaVRIs6LenRYztKt8tFOZzWltIxQgROXDc903tLrLh_gzLusLDaUOpvvce0z58Oij62limS1___mBHhx37eqHMpHTi4TrEjpyiBoJgOEsY4MrxfXNMPH2Ypsac8b3RfzLOHTYJm2gKAOK2QQDe1UXhKnaAGhx89BNhLQ78drKkTBm1J4BiirFWfLEKTU10t6NYU7rG8Qlm_ftWJ_86c6Jn2hz2JRRu7toEQm9k1cD-e6u36b03KMGzlr6G8H_7x18S4f8vHL8_lmql0NjyQS9hRKwreU1--jq1BS3DtjXBEeR40RcdVA34xWvIerkVtsArPYWV4FzLo7tPOvxBAm1kqEoH5w5hZeTRhg4FVmA7a2XB88gd4aui64Bc4LWg487O0wzts0DOxZtQBNcrOfMTR3tVk_1AdpvO_8OHZLSqu7D0hxNN0rujJgLgmqA7kDG91zZaJOQxdV1Xqj_CtmBej-2w5-3w8-1X4FzETbl9VlNalrMShl304308bmtYHmxJb9IAx6IkCvoMRP86RLOzTv73JePemlIGghGi5mWqXIiegrMtq6hx-1Qty6uadlv_7pHzQ0BmokyZjhK35eGhPK_R9qDhy0R680eKXXUTD6fB4YkXNcN_0aGpRx1F8oYoPJk_xYC