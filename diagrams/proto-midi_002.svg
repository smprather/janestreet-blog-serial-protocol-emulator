40</text><line x1="481.9" y1="340.44" x2="523.9" y2="340.44" style="stroke:#333;stroke-width:1;"/><line x1="523.9" y1="340.44" x2="523.9" y2="353.44" style="stroke:#333;stroke-width:1;"/><line x1="482.9" y1="353.44" x2="523.9" y2="353.44" style="stroke:#333;stroke-width:1;"/><polygon points="492.9,349.44,482.9,353.44,492.9,357.44,488.9,353.44" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="488.9" y="334.631" fill="#000" font-size="13" textLength="148.2" font-family="monospace">message 0: 90 20 40</text><path d="M60.1,379.44 L331.3,379.44 L331.3,389.146 L321.3,399.146 L60.1,399.146 L60.1,379.44" style="stroke:#B0B0B0;stroke-width:1.5;" fill="#FBFBFB"/><rect x="60.1" y="379.44" width="608.6" height="245.942" fill="none" style="stroke:#B0B0B0;stroke-width:1.5;"/><text x="75.1" y="394.337" fill="#000" font-size="13" textLength="226.2" font-weight="700" font-family="monospace">m = 1, 2  running status 0x90</text><polygon points="126.1,428.852,136.1,432.852,126.1,436.852,130.1,432.852" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="76.1" y1="432.852" x2="132.1" y2="432.852" style="stroke:#333;stroke-width:1;"/><text x="83.1" y="427.043" fill="#000" font-size="13" textLength="15.6" font-family="monospace">21</text><polygon points="126.1,460.558,136.1,464.558,126.1,468.558,130.1,464.558" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="76.1" y1="464.558" x2="132.1" y2="464.558" style="stroke:#333;stroke-width:1;"/><text x="83.1" y="458.749" fill="#000" font-size="13" textLength="15.6" font-family="monospace">41</text><line x1="481.9" y1="496.264" x2="523.9" y2="496.264" style="stroke:#333;stroke-width:1;"/><line x1="523.9" y1="496.264" x2="523.9" y2="509.264" style="stroke:#333;stroke-width:1;"/><line x1="482.9" y1="509.264" x2="523.9" y2="509.264" style="stroke:#333;stroke-width:1;"/><polygon points="492.9,505.264