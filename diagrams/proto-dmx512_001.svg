<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:1440px;height:1105px;background:#FFFFFF;" width="1440px" height="1105px" viewBox="0 0 1440 1105" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="90"><text x="437.801" y="29.966" fill="#000" font-size="14" textLength="562.798" font-weight="700" font-family="monospace">DMX512-A — one frame is a break, a mark, a START code and 512 slots</text></g><rect x="204" y="255.322" width="812.5" height="152.236" fill="none" style="stroke:#B0B0B0;stroke-width:1.5;"/><rect x="13" y="425.558" width="1407.399" height="313.884" fill="none" style="stroke:#B0B0B0;stroke-width:1.5;"/><g><title>master</title><rect x="216.5" y="148.204" width="8" height="847.711" fill="#000" fill-opacity="0"/><line x1="220" y1="148.204" x2="220" y2="995.914" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>wire</title><rect x="809.9" y="148.204" width="8" height="847.711" fill="#000" fill-opacity="0"/><line x1="813.4" y1="148.204" x2="813.4" y2="995.914" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>receiver</title><rect x="1364.299" y="148.204" width="8" height="847.711" fill="#000" fill-opacity="0"/><line x1="1367.799" y1="148.204" x2="1367.799" y2="995.914" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><text x="191.8" y="125.034" fill="#5A3D12" font-size="14" textLength="50.4" font-family="monospace">master</text><text x="191.8" y="144.102" fill="#5A3D12" font-size="14" textLength="50.4" font-family="monospace">pe_soc</text><ellipse cx="220" cy="58.568" rx="8" ry="8" fill="#FBE9CF" style="stroke:#B8813A;stroke-width:0.5;"/><path d="M220,66.568 L220,93.568 M207,74.568 L233,74.568 M220,93.568 L207,108.568 M220,93.568 L233,108.568" style="stroke:#B8813A;stroke-width:0.5;" fill="none"/><rect x="785.4" y="95.068" width="56" height="52.136" fill="#EEF3FB" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="796.6" y="117.034" fill="#16324F" font-size="14" textLength="33.6" font-family="monospace">wire</text><text x="792.4" y="136.102" fill="#16324F" font-size="14" textLength="42" font-family="monospace">bit 0</text><text x="1331.199" y="144.102" fill="#5A3D12" font-size="14" textLength="67.2" font-family="monospace">receiver</text><ellipse cx="1367.799" cy="77.636" rx="8" ry="8" fill="#FBE9CF" style="stroke:#B8813A;stroke-width:0.5;"/><path d="M1367.799,85.636 L1367.799,112.636 M1354.799,93.636 L1380.799,93.636 M1367.799,112.636 L1354.799,127.636 M1367.799,112.636 L1380.799,127.636" style="stroke:#B8813A;stroke-width:0.5;" fill="none"/><text x="191.8" y="1010.88" fill="#5A3D12" font-size="14" textLength="50.4" font-family="monospace">master</text><text x="191.8" y="1029.948" fill="#5A3D12" font-size="14" textLength="50.4" font-family="monospace">pe_soc</text><ellipse cx="220" cy="1042.55" rx="8" ry="8" fill="#FBE9CF" style="stroke:#B8813A;stroke-width:0.5;"/><path d="M220,1050.55 L220,1077.55 M207,1058.55 L233,1058.55 M220,1077.55 L207,1092.55 M220,1077.55 L233,1092.55" style="stroke:#B8813A;stroke-width:0.5;" fill="none"/><rect x="785.4" y="995.914" width="56" height="52.136" fill="#EEF3FB" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="796.6" y="1017.88" fill="#16324F" font-size="14" textLength="33.6" font-family="monospace">wire</text><text x="792.4" y="1036.948" fill="#16324F" font-size="14" textLength="42" font-family="monospace">bit 0</text><text x="1331.199" y="1010.88" fill="#5A3D12" font-size="14" textLength="67.2" font-family="monospace">receiver</text><ellipse cx="1367.799" cy="1023.482" rx="8" ry="8" fill="#FBE9CF" style="stroke:#B8813A;stroke-width:0.5;"/><path d="M1367.799,1031.482 L1367.799,1058.482 M1354.799,1039.482 L1380.799,1039.482 M1367.799,1058.482 L1354.799,1073.482 M1367.799,1058.482 L1380.799,1073.482" style="stroke:#B8813A;stroke-width:0.5;" fill="none"/><polygon points="801.4,175.91,811.4,179.91,801.4,183.91,805.4,179.91" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="220" y1="179.91" x2="807.4" y2="179.91" style="stroke:#333;stroke-width:1;"/><text x="227" y="174.101" fill="#000" font-size="13" textLength="436.8" font-family="monospace">BREAK — 22 cells of LOW = 88.06 us measured (floor 87.5)</text><polygon points="1355.799,207.616,1365.799,211.616,1355.799,215.616,1359.799,211.616" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="813.4" y1="211.616" x2="1361.799" y2="211.616" style="stroke:#333;stroke-width:1;"/><text x="820.4" y="205.807" fill="#000" font-size="13" textLength="530.4" font-family="monospace">a receiver will not look at a frame that does not begin with a break</text><polygon points="801.4,239.322,811.4,243.322,801.4,247.322,805.4,243.322" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="220" y1="243.322" x2="807.4" y2="243.322" style="stroke:#333;stroke-width:1;"/><text x="227" y="237.513" fill="#000" font-size="13" textLength="421.2" font-family="monospace">MARK — 3 cells of HIGH = 12.38 us measured (floor 8.0)</text><path d="M204,255.322 L654.6,255.322 L654.6,265.028 L644.6,275.028 L204,275.028 L204,255.322" style="stroke:#B0B0B0;stroke-width:1.5;" fill="#FBFBFB"/><rect x="204" y="255.322" width="812.5" height="152.236" fill="none" style="stroke:#B0B0B0;stroke-width:1.5;"/><text x="219" y="270.219" fill="#000" font-size="13" textLength="405.6" font-weight="700" font-family="monospace">slot 0: the START code, through the SAME transmitter</text><polygon points="801.4,304.734,811.4,308.734,801.4,312.734,805.4,308.734" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="220" y1="308.734" x2="807.4" y2="308.734" style="stroke:#333;stroke-width:1;"/><text x="227" y="302.925" fill="#000" font-size="13" textLength="171.6" font-family="monospace">0x00 = 11 cells of 8N2</text><path d="M631.3,321.734 L631.3,401.734 L995.3,401.734 L995.3,331.734 L985.3,321.734 L631.3,321.734" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M985.3,321.734 L985.3,331.734 L995.3,331.734 L985.3,321.734" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="637.3" y="340.631" fill="#000" font-size="13" textLength="343.2" font-family="monospace">The start code is what tells a receiver what</text><text x="637.3" y="358.337" fill="#000" font-size="13" textLength="335.4" font-family="monospace">the 512 slots MEAN. 513 slots with no start</text><text x="637.3" y="376.043" fill="#000" font-size="13" textLength="343.2" font-family="monospace">code is the most common way to end up with a</text><text x="637.3" y="393.749" fill="#000" font-size="13" textLength="280.8" font-family="monospace">working fixture that lights nothing.</text><path d="M13,425.558 L471.4,425.558 L471.4,435.264 L461.4,445.264 L13,445.264 L13,425.558" style="stroke:#B0B0B0;stroke-width:1.5;" fill="#FBFBFB"/><rect x="13" y="425.558" width="1407.399" height="313.884" fill="none" style="stroke:#B0B0B0;stroke-width:1.5;"/><text x="28" y="440.455" fill="#000" font-size="13" textLength="413.4" font-weight="700" font-family="monospace">slots 1..512: a wrapping 8-bit ramp, two pages of 256</text><polygon points="801.4,474.97,811.4,478.97,801.4,482.97,805.4,478.97" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="220" y1="478.97" x2="807.4" y2="478.97" style="stroke:#333;stroke-width:1;"/><text x="227" y="473.161" fill="#000" font-size="13" textLength="569.4" font-family="monospace">slot 1 = 0x01 ... slot 128 = 0x80 ... slot 256 = 0x00 ... slot 512 = 0xFF</text><path d="M34,491.97 L34,589.97 L405,589.97 L405,501.97 L395,491.97 L34,491.97" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M395,491.97 L395,501.97 L405,501.97 L395,491.97" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="40" y="510.867" fill="#000" font-size="13" textLength="335.4" font-family="monospace">An 8-bit register incremented with an 8-bit</text><text x="40" y="528.573" fill="#000" font-size="13" textLength="343.2" font-family="monospace">add IS a wrapping ramp, so the payload costs</text><text x="40" y="546.279" fill="#000" font-size="13" textLength="351" font-family="monospace">two instructions per slot to produce, and the</text><text x="40" y="563.985" fill="#000" font-size="13" textLength="327.6" font-family="monospace">TB recomputes all 512 independently rather</text><text x="40" y="581.691" fill="#000" font-size="13" textLength="327.6" font-family="monospace">than trusting a 513-entry list of its own.</text><path d="M192.6,600.5 L192.6,733.5 L1394.6,733.5 L1394.6,610.5 L1384.6,600.5 L192.6,600.5" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1384.6,600.5 L1384.6,610.5 L1394.6,610.5 L1384.6,600.5" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="606.1" y="619.397" fill="#000" font-size="13" textLength="366.6" font-family="monospace">AND THE BIT ORDER IS NOT A PALINDROME ANYWHERE:</text><text x="606.1" y="637.103" fill="#000" font-size="13" textLength="319.8" font-family="monospace">slot 1 is 0x01 and slot 128 is 0x80, so a</text><text x="606.1" y="654.809" fill="#000" font-size="13" textLength="366.6" font-family="monospace">transmitter that shifted the wrong way produces</text><text x="606.1" y="672.515" fill="#000" font-size="13" textLength="366.6" font-family="monospace">0x80 and 0x01 - swapped, not identical. That is</text><text x="606.1" y="690.221" fill="#000" font-size="13" textLength="312" font-family="monospace">what makes the per-slot comparison worth</text><text x="606.1" y="707.927" fill="#000" font-size="13" textLength="351" font-family="monospace">anything, and it is why the payload is a ramp</text><text x="606.1" y="725.633" fill="#000" font-size="13" textLength="148.2" font-family="monospace">and not a constant.</text><path d="M192.6,758.442 L192.6,980.442 L1394.6,980.442 L1394.6,768.442 L1384.6,758.442 L192.6,758.442" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1384.6,758.442 L1384.6,768.442 L1394.6,768.442 L1384.6,758.442" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="493" y="777.339" fill="#000" font-size="13" textLength="546" font-family="monospace">513 x 11 x 4.000 us = 22.572 ms of frame, plus the break and the mark.</text><text x="493" y="795.045" fill="#000" font-size="13" textLength="585" font-family="monospace">The TB's drain window is derived from that: 26 ms, which is 15% of headroom</text><text x="493" y="812.751" fill="#000" font-size="13" textLength="577.2" font-family="monospace">over a number that is computed rather than guessed. The first version of a</text><text x="493" y="830.457" fill="#000" font-size="13" textLength="546" font-family="monospace">testbench that guessed allowed 900 us — a twentieth of the frame — and</text><text x="493" y="848.163" fill="#000" font-size="13" textLength="475.8" font-family="monospace">reported a truncated stream as if it were a protocol failure.</text><text x="493" y="865.869" fill="#000" font-size="13" font-family="monospace"> </text><text x="493" y="883.575" fill="#000" font-size="13" textLength="577.2" font-family="monospace">HOW A SLOT'S START BIT IS FOUND, since a falling edge is not one: within a</text><text x="493" y="901.281" fill="#000" font-size="13" textLength="592.8" font-family="monospace">slot of 8N2 the LAST possible falling edge is at cell 8, because cells 9 and</text><text x="493" y="918.987" fill="#000" font-size="13" textLength="577.2" font-family="monospace">10 are both stop bits and cannot fall. A fall at least 9.5 cells after the</text><text x="493" y="936.693" fill="#000" font-size="13" textLength="561.6" font-family="monospace">current slot's start bit is therefore not inside that slot, and the next</text><text x="493" y="954.399" fill="#000" font-size="13" textLength="585" font-family="monospace">slot's start bit is the only thing it can be. The first slot is anchored on</text><text x="493" y="972.105" fill="#000" font-size="13" textLength="538.2" font-family="monospace">the BREAK, which is 88 us of LOW and is not confusable with anything.</text><?plantuml-src TLRjJkD65FsVfxZQgjgk5Any43OWRILJme9AmYgaefLMgYRsE1bXpxWpuuRywqFq2ViaFNV60REmy2Fn-7wUUywTUELBIHVptoV3qL5A__tpBnajgR2YagGS2LfRAHxw-5896pxlLkboHPd99GcT4np9bSQxddjGkXRmf5mMeYdzfT5-mO7cHXjNYqpc7QClmdgLgLfeVowoXuqrZSv_CQMnz8EKnRXOVyVOs5pQrl1Od1HYyhOXfs_DXYVZqN7HCKipR-ohjCLQdcQlpRe9rzFfS2o-DUcaceXnFXnr3ExaNutKcVoCJFKRAVd_k-OlKW_ulvlQMhDhNux3Nwydk1nwLmddfVsgQ_cdCzax4exclVeP6tgtKrP-rMlbQH1UtnzShSoa-blQSBhizUPqz3FTqncTBsVfhu4Yen5biYmTcO9kRk_f4qsdoU246aUL5AwnCgUVYj8WtFHZCldGk-SOIyGGT0XFErMMf8qds3sGy7WNQUUtUCYDTE7jMcwKXh7V7iZuND4yNSQ2ni_rN5r_la91mr4odhvPK3BuqECHr86sD3X3GjbXTH_FUBtPnlDqFYDlXNQLye2qH_IKVl0u672guNFswM842zGjoN2JztWYMY6Gyq0_oWQwsd6FFdXr8S5fSE3CJyAY-InT97WUjyy136rYo61_2Cj-bN6SfweCO1DxyeOaT8f-8uZ1OMSiQBIXGZrwe1CnBzLcwmFgMxnBOCYEt4mFNpgWEHec2UhZUUwig6iEDJrYCc62DH3S6Qh5HWPCHfEJBce1zI5m0tn3IfAaFHbDmzbqy7m6psZNEMDO-EpoyWNGyz1MgWzbW3Mi058wixAIseC1iV_M9DYBFAVhksuNiNvd0fIrs9T6v43JOR-5mQ0nfPstJUQLqOvgv0Xr0URQchp9G23UY_2Fip_d-PggRZpW4E0yTw1qBck0YiBAFPB2shQJHu48xpnN8tZgHp2oUqm7SmMS2l2RdNundXT8zA7Q0CRYWbPNCpg_Nj7jycAsv5ONjojAwKjwSxsuMDw2s-dYZ_khsN9s5dpQuO1AOJhSoDDqmk5q4D29BEhe8ZB8RLN1I3DuEslG0JEmnIKY62RCSKE28t8x82_pVX2xOa1K9ie4ca4y5Ns2MYhn82F3WVbHg8fX5LOvPhgnVXjdglU1lt4CoaUvxLyCDDniFEhM8y28emmZzLYFhxZVUuKlo_6HjVz8nya03CMk-OJDc4m-ZgWAn0_hh4zrsSIwm_Owa2FSfvo7byFg_BsZt8gmwNHkTbmXDZ-sGeumfWhmdj7e1A7xQ4TbMpOPJdxaH5ifScjCXMYXH46wgTQ7eS2kvL_UCYsoRDD8vsIUX0eAPK4lE3lGccFoXC5OlyPbj8s1MWSciTdXypHspGjOG1ayEWc5mPdxYyiyl0I011NKc16xCxzr9lWxb2Hna-6cKSnisaai8y6CyIOp9HL2bTXFIGy1hd3Jf7HtSxjwVzVkQwOsI7rv-zlY0ho4sDcxG86i7fbl