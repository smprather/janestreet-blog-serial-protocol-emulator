<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:1338px;height:1241px;background:#FFFFFF;" width="1338px" height="1241px" viewBox="0 0 1338 1241" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="94"><text x="416.301" y="29.966" fill="#000" font-size="14" textLength="503.998" font-weight="700" font-family="monospace">SPI mode 3 — one CS_N frame is 40 SCLK rises, in four fields</text></g><rect x="172.8" y="223.616" width="970.4" height="215.648" fill="none" style="stroke:#B0B0B0;stroke-width:1.5;"/><rect x="172.8" y="457.264" width="1145.8" height="187.648" fill="none" style="stroke:#B0B0B0;stroke-width:1.5;"/><rect x="670" y="662.912" width="473.2" height="134.53" fill="none" style="stroke:#B0B0B0;stroke-width:1.5;"/><rect x="13" y="815.442" width="1130.2" height="152.236" fill="none" style="stroke:#B0B0B0;stroke-width:1.5;"/><g><title>master</title><rect x="185.3" y="148.204" width="8" height="983.711" fill="#000" fill-opacity="0"/><line x1="188.8" y1="148.204" x2="188.8" y2="1131.914" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>SCLK</title><rect x="591.5" y="148.204" width="8" height="983.711" fill="#000" fill-opacity="0"/><line x1="595" y1="148.204" x2="595" y2="1131.914" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>MOSI</title><rect x="657.5" y="148.204" width="8" height="983.711" fill="#000" fill-opacity="0"/><line x1="661" y1="148.204" x2="661" y2="1131.914" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>MISO</title><rect x="857.9" y="148.204" width="8" height="983.711" fill="#000" fill-opacity="0"/><line x1="861.4" y1="148.204" x2="861.4" y2="1131.914" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>slave</title><rect x="1123.7" y="148.204" width="8" height="983.711" fill="#000" fill-opacity="0"/><line x1="1127.2" y1="148.204" x2="1127.2" y2="1131.914" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><text x="160.6" y="125.034" fill="#5A3D12" font-size="14" textLength="50.4" font-family="monospace">master</text><text x="160.6" y="144.102" fill="#5A3D12" font-size="14" textLength="50.4" font-family="monospace">pe_soc</text><ellipse cx="188.8" cy="58.568" rx="8" ry="8" fill="#FBE9CF" style="stroke:#B8813A;stroke-width:0.5;"/><path d="M188.8,66.568 L188.8,93.568 M175.8,74.568 L201.8,74.568 M188.8,93.568 L175.8,108.568 M188.8,93.568 L201.8,108.568" style="stroke:#B8813A;stroke-width:0.5;" fill="none"/><rect x="567" y="95.068" width="56" height="52.136" fill="#EEF3FB" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="578.2" y="117.034" fill="#16324F" font-size="14" textLength="33.6" font-family="monospace">SCLK</text><text x="574" y="136.102" fill="#16324F" font-size="14" textLength="42" font-family="monospace">bit 0</text><rect x="633" y="95.068" width="56" height="52.136" fill="#EEF3FB" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="644.2" y="117.034" fill="#16324F" font-size="14" textLength="33.6" font-family="monospace">MOSI</text><text x="640" y="136.102" fill="#16324F" font-size="14" textLength="42" font-family="monospace">bit 1</text><rect x="833.4" y="95.068" width="56" height="52.136" fill="#EEF3FB" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="844.6" y="117.034" fill="#16324F" font-size="14" textLength="33.6" font-family="monospace">MISO</text><text x="840.4" y="136.102" fill="#16324F" font-size="14" textLength="42" font-family="monospace">bit 3</text><text x="1103.2" y="125.034" fill="#5A3D12" font-size="14" textLength="42" font-family="monospace">slave</text><text x="1057" y="144.102" fill="#5A3D12" font-size="14" textLength="134.399" font-family="monospace">decodes the pins</text><ellipse cx="1127.2" cy="58.568" rx="8" ry="8" fill="#FBE9CF" style="stroke:#B8813A;stroke-width:0.5;"/><path d="M1127.2,66.568 L1127.2,93.568 M1114.2,74.568 L1140.2,74.568 M1127.2,93.568 L1114.2,108.568 M1127.2,93.568 L1140.2,108.568" style="stroke:#B8813A;stroke-width:0.5;" fill="none"/><text x="160.6" y="1146.88" fill="#5A3D12" font-size="14" textLength="50.4" font-family="monospace">master</text><text x="160.6" y="1165.948" fill="#5A3D12" font-size="14" textLength="50.4" font-family="monospace">pe_soc</text><ellipse cx="188.8" cy="1178.55" rx="8" ry="8" fill="#FBE9CF" style="stroke:#B8813A;stroke-width:0.5;"/><path d="M188.8,1186.55 L188.8,1213.55 M175.8,1194.55 L201.8,1194.55 M188.8,1213.55 L175.8,1228.55 M188.8,1213.55 L201.8,1228.55" style="stroke:#B8813A;stroke-width:0.5;" fill="none"/><rect x="567" y="1131.914" width="56" height="52.136" fill="#EEF3FB" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="578.2" y="1153.88" fill="#16324F" font-size="14" textLength="33.6" font-family="monospace">SCLK</text><text x="574" y="1172.948" fill="#16324F" font-size="14" textLength="42" font-family="monospace">bit 0</text><rect x="633" y="1131.914" width="56" height="52.136" fill="#EEF3FB" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="644.2" y="1153.88" fill="#16324F" font-size="14" textLength="33.6" font-family="monospace">MOSI</text><text x="640" y="1172.948" fill="#16324F" font-size="14" textLength="42" font-family="monospace">bit 1</text><rect x="833.4" y="1131.914" width="56" height="52.136" fill="#EEF3FB" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="844.6" y="1153.88" fill="#16324F" font-size="14" textLength="33.6" font-family="monospace">MISO</text><text x="840.4" y="1172.948" fill="#16324F" font-size="14" textLength="42" font-family="monospace">bit 3</text><text x="1103.2" y="1146.88" fill="#5A3D12" font-size="14" textLength="42" font-family="monospace">slave</text><text x="1057" y="1165.948" fill="#5A3D12" font-size="14" textLength="134.399" font-family="monospace">decodes the pins</text><ellipse cx="1127.2" cy="1178.55" rx="8" ry="8" fill="#FBE9CF" style="stroke:#B8813A;stroke-width:0.5;"/><path d="M1127.2,1186.55 L1127.2,1213.55 M1114.2,1194.55 L1140.2,1194.55 M1127.2,1213.55 L1114.2,1228.55 M1127.2,1213.55 L1140.2,1228.55" style="stroke:#B8813A;stroke-width:0.5;" fill="none"/><polygon points="583,175.91,593,179.91,583,183.91,587,179.91" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="188.8" y1="179.91" x2="589" y2="179.91" style="stroke:#333;stroke-width:1;"/><text x="195.8" y="174.101" fill="#000" font-size="13" textLength="148.2" font-family="monospace">CS_N (bit 2) 1 -> 0</text><polygon points="583,207.616,593,211.616,583,215.616,587,211.616" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="188.8" y1="211.616" x2="589" y2="211.616" style="stroke:#333;stroke-width:1;"/><text x="195.8" y="205.807" fill="#000" font-size="13" textLength="382.2" font-family="monospace">SCLK idles HIGH — the reset level happens to be 1</text><path d="M172.8,223.616 L459.6,223.616 L459.6,233.322 L449.6,243.322 L172.8,243.322 L172.8,223.616" style="stroke:#B0B0B0;stroke-width:1.5;" fill="#FBFBFB"/><rect x="172.8" y="223.616" width="970.4" height="215.648" fill="none" style="stroke:#B0B0B0;stroke-width:1.5;"/><text x="187.8" y="238.513" fill="#000" font-size="13" textLength="241.8" font-weight="700" font-family="monospace">WORD — 16 rises, MOSI MSB first</text><polygon points="649,273.028,659,277.028,649,281.028,653,277.028" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="188.8" y1="277.028" x2="655" y2="277.028" style="stroke:#333;stroke-width:1;"/><text x="195.8" y="271.219" fill="#000" font-size="13" textLength="234" font-family="monospace">rise 0..7   0001 0001   = 0x11</text><polygon points="872.4,304.734,862.4,308.734,872.4,312.734,868.4,308.734" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="866.4" y1="308.734" x2="1126.2" y2="308.734" style="stroke:#333;stroke-width:1;"/><text x="878.4" y="302.925" fill="#000" font-size="13" textLength="226.2" font-family="monospace">MISO idle LOW for rises 0..23</text><polygon points="649,336.44,659,340.44,649,344.44,653,340.44" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="188.8" y1="340.44" x2="655" y2="340.44" style="stroke:#333;stroke-width:1;"/><text x="195.8" y="334.631" fill="#000" font-size="13" textLength="234" font-family="monospace">rise 8..15  0011 0100   = 0x34</text><path d="M506.2,353.44 L506.2,433.44 L815.2,433.44 L815.2,363.44 L805.2,353.44 L506.2,353.44" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M805.2,353.44 L805.2,363.44 L815.2,363.44 L805.2,353.44" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="512.2" y="372.337" fill="#000" font-size="13" textLength="265.2" font-family="monospace">measured on the wire: word = 1134.</text><text x="512.2" y="390.043" fill="#000" font-size="13" textLength="280.8" font-family="monospace">0x1134 is not a bit palindrome - its</text><text x="512.2" y="407.749" fill="#000" font-size="13" textLength="288.6" font-family="monospace">reversal is 0x3411 - so a master that</text><text x="512.2" y="425.455" fill="#000" font-size="13" textLength="257.4" font-family="monospace">shifted the other way is visible.</text><path d="M172.8,457.264 L646.8,457.264 L646.8,466.97 L636.8,476.97 L172.8,476.97 L172.8,457.264" style="stroke:#B0B0B0;stroke-width:1.5;" fill="#FBFBFB"/><rect x="172.8" y="457.264" width="1145.8" height="187.648" fill="none" style="stroke:#B0B0B0;stroke-width:1.5;"/><text x="187.8" y="472.161" fill="#000" font-size="13" textLength="429" font-weight="700" font-family="monospace">CRC8(WORD) — 8 rises, the transmit-side integrity check</text><polygon points="649,506.676,659,510.676,649,514.676,653,510.676" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="188.8" y1="510.676" x2="655" y2="510.676" style="stroke:#333;stroke-width:1;"/><text x="195.8" y="504.867" fill="#000" font-size="13" textLength="241.8" font-family="monospace">rise 16..23  1100 1110   = 0xCE</text><path d="M956.8,523.676 L956.8,639.676 L1296.8,639.676 L1296.8,533.676 L1286.8,523.676 L956.8,523.676" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1286.8,523.676 L1286.8,533.676 L1296.8,533.676 L1286.8,523.676" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="962.8" y="542.573" fill="#000" font-size="13" textLength="296.4" font-family="monospace">the slave recomputes CRC-8 over the 16</text><text x="962.8" y="560.279" fill="#000" font-size="13" textLength="312" font-family="monospace">bits it decoded and requires it to equal</text><text x="962.8" y="577.985" fill="#000" font-size="13" textLength="312" font-family="monospace">these 8. A reference datapath written in</text><text x="962.8" y="595.691" fill="#000" font-size="13" textLength="319.8" font-family="monospace">Verilog straight from the polynomial says</text><text x="962.8" y="613.397" fill="#000" font-size="13" textLength="288.6" font-family="monospace">the same thing: a CRC checked against</text><text x="962.8" y="631.103" fill="#000" font-size="13" textLength="171.6" font-family="monospace">itself proves nothing.</text><path d="M670,662.912 L949,662.912 L949,672.618 L939,682.618 L670,682.618 L670,662.912" style="stroke:#B0B0B0;stroke-width:1.5;" fill="#FBFBFB"/><rect x="670" y="662.912" width="473.2" height="134.53" fill="none" style="stroke:#B0B0B0;stroke-width:1.5;"/><text x="685" y="677.809" fill="#000" font-size="13" textLength="234" font-weight="700" font-family="monospace">RESP — 8 rises, MISO MSB first</text><polygon points="872.4,712.324,862.4,716.324,872.4,720.324,868.4,716.324" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="866.4" y1="716.324" x2="1126.2" y2="716.324" style="stroke:#333;stroke-width:1;"/><text x="878.4" y="710.515" fill="#000" font-size="13" textLength="241.8" font-family="monospace">rise 24..31  0110 1111   = 0x6F</text><path d="M691,729.324 L691,792.324 L1031,792.324 L1031,739.324 L1021,729.324 L691,729.324" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1021,729.324 L1021,739.324 L1031,739.324 L1021,729.324" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="697" y="748.221" fill="#000" font-size="13" textLength="288.6" font-family="monospace">resp = word[15:8] XOR 0x7E, one byte.</text><text x="697" y="765.927" fill="#000" font-size="13" textLength="304.2" font-family="monospace">The mask's low half (0x5A) is dead: the</text><text x="697" y="783.633" fill="#000" font-size="13" textLength="319.8" font-family="monospace">slave's response register is 8 bits wide.</text><path d="M13,815.442 L401.2,815.442 L401.2,825.148 L391.2,835.148 L13,835.148 L13,815.442" style="stroke:#B0B0B0;stroke-width:1.5;" fill="#FBFBFB"/><rect x="13" y="815.442" width="1130.2" height="152.236" fill="none" style="stroke:#B0B0B0;stroke-width:1.5;"/><text x="28" y="830.339" fill="#000" font-size="13" textLength="343.2" font-weight="700" font-family="monospace">CRC8(RESP) — 8 rises, the receive-side check</text><polygon points="872.4,864.854,862.4,868.854,872.4,872.854,868.4,868.854" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="866.4" y1="868.854" x2="1126.2" y2="868.854" style="stroke:#333;stroke-width:1;"/><text x="878.4" y="863.045" fill="#000" font-size="13" textLength="241.8" font-family="monospace">rise 32..39  0000 1010   = 0x0A</text><path d="M34,881.854 L34,961.854 L343,961.854 L343,891.854 L333,881.854 L34,881.854" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M333,881.854 L333,891.854 L343,891.854 L333,881.854" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="40" y="900.751" fill="#000" font-size="13" textLength="241.8" font-family="monospace">the firmware recomputes this in</text><text x="40" y="918.457" fill="#000" font-size="13" textLength="257.4" font-family="monospace">software and compares. Exactly 40</text><text x="40" y="936.163" fill="#000" font-size="13" textLength="288.6" font-family="monospace">rises: a master that clocked 39 or 41</text><text x="40" y="953.869" fill="#000" font-size="13" textLength="265.2" font-family="monospace">would still shift plausible bytes.</text><polygon points="583,1001.384,593,1005.384,583,1009.384,587,1005.384" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="188.8" y1="1005.384" x2="589" y2="1005.384" style="stroke:#333;stroke-width:1;"/><text x="195.8" y="999.575" fill="#000" font-size="13" textLength="85.8" font-family="monospace">CS_N 0 -> 1</text><path d="M144.6,1018.384 L144.6,1116.384 L1170.6,1116.384 L1170.6,1028.384 L1160.6,1018.384 L144.6,1018.384" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1160.6,1018.384 L1160.6,1028.384 L1170.6,1028.384 L1160.6,1018.384" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="361" y="1037.281" fill="#000" font-size="13" textLength="553.8" font-family="monospace">MODE 3 IS NOT MODE 0 WITH THE CLOCK INVERTED.  Both modes sample on the</text><text x="361" y="1054.987" fill="#000" font-size="13" textLength="577.2" font-family="monospace">RISING edge, so a mode-0 program is a plausible-looking mode-3 program for</text><text x="361" y="1072.693" fill="#000" font-size="13" textLength="569.4" font-family="monospace">the first half-frame and then delivers bit k-1 as bit k — shifted by one,</text><text x="361" y="1090.399" fill="#000" font-size="13" textLength="585" font-family="monospace">with nothing on the wire that looks wrong. The two things that catch it are</text><text x="361" y="1108.105" fill="#000" font-size="13" textLength="491.4" font-family="monospace">a slave that decodes the pins, and the check on the IDLE LEVEL.</text><?plantuml-src XLRTRkf64BxtKupIYoOI81iJ3WUfbHB2IQm38S9HKgcfZXPx3Qiik-xk4i9T7w9Fs2Vfp2uaa9yM96HxFi_FDz_CueIJ7FAR39Qwv932Ft_z3Lfn6EG_hg4oRCb1MEZ4a0z6ty48osq3X89AhmnKWilIHlPHg9eX5afUiPLqtxHor_JgM2jjQrRmSWzqmumJXQYPSkUiU9mRlLBbG4jju2VEgxIQVGBMfkHc2-omRiLEFmPI-2qiwQRjJhK7EokSDk_2LZF-jNWFsmyuw_MIbBs5x8KwPMcPjFS0EVzpnLN1Bp5I_K58-duAFmWTqtS_j35wlJMc_XD5ZDA1eoMpZfi7LVCVLXT7m2oCe_gL6pYYHZwecN0GU_FWq3oUv5am9zuyUMFEyaamfzwSxG9RoPxuWofvWKAou1OSQg6i1-LHD8Rchp20VX3MCJbedq12J-DNenUPA2KwkCekhxmQoPFXbZkG_8bBMB2wvWeZQ9XnI29YjORxoVJ2mvFkJgLK2OppSvIfiIu2y64c68O04BTQNm0WZkCa_03y0l5paY0o9sI6I2hN9mIZoJsAtWJdz78xVUUorsebf-GoGPT976zTfXr4Akquw2Tka55y3alExChm4gVDbxWMXlTXZNt7Tv8axRGyZ19AEpI3w00O474raqALHkE0DK4uwu46oJ6MIO9II4oX2LRZAq4I68GvZxGBKJaCJ54r_XXOimszzYIic4bEWRagVSOHNNY6jpmFfeFUCP5zujdkxSWcPyumPPV2DQt0NIAKutCZt0QA1IyUtv6LT8b3m5gHg0H_jsmDXWTivJvdSkyLXdKMUbcl73O1Ssds0ehiITT3aI6Bh41GOWaCAp0uMyYlVuwwmJicTtvzt-0CCHKtD81GCiTgvXQmnlGTLrYA1zzn8wIUWyL2nNpXS3_gPL2wbXkbbmBfjsnZNrEc9UWMGitxs0ZCDt11MSqPJaTe22RCPGMrmL9yd-c5_-p2T9ZV7FBlXRelzXS9UxBRdLOhHOd7n3EIlLDxzzi1sTbMIhP6Asdnz-Iqt_i3VfjC4VnbsF1dmspZU53dBTQ8ydhysOBKQnnDBECuVZuzEo4zbPoLVU8Xo8xQXq3ohfMbJiw5LoP2Uw5jQnJE_ykFglz0VgWCBfvuKDzESuSqf6sauQiVUgGXVj5SV7P0m_YbWSZcSitCWUomFNOd2Qihv-saCaBWjMt1y1ctejpWkHa8fIJxXwC8XTHU2PWFhfLEuf5hlP8b2an86UOKQibMVYmzxVOJTWxNQqntIHJjLTJmWpIUN0pnaCzok9xSXhiOxhFRAxYz6i9WD1byX-pwRZYz7Lwq0CvHYlwFWIKbrvX3M5ReQPhbsVKby7BE6zirWxXcJ2gUqnc57B7Nv9jIQpo-vW6Llg1meqOlJ5ld5TGCVpk8KJGeb94KjDlyxdji9dIY-4ilWTqscsr8cmtqjXQOzNQAzhThe9qIGQ4PZIFczUlMEeoetVQ5kM91Ym9RYTxOTkzuszlJhR7BCkXj5osx60rXDBmRZbhHhbd_0W00?></g></svg>