<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:1299px;height:1223px;background:#FFFFFF;" width="1299px" height="1223px" viewBox="0 0 1299 1223" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="94"><text x="396.801" y="29.966" fill="#000" font-size="14" textLength="503.998" font-weight="700" font-family="monospace">SPI mode 3 — one CS_N frame is 40 SCLK rises, in four fields</text></g><rect x="172.8" y="223.616" width="931.4" height="215.648" fill="none" style="stroke:#B0B0B0;stroke-width:1.5;"/><rect x="172.8" y="457.264" width="1106.8" height="187.648" fill="none" style="stroke:#B0B0B0;stroke-width:1.5;"/><rect x="670" y="662.912" width="434.2" height="116.824" fill="none" style="stroke:#B0B0B0;stroke-width:1.5;"/><rect x="13" y="797.736" width="1091.2" height="152.236" fill="none" style="stroke:#B0B0B0;stroke-width:1.5;"/><g><title>master</title><rect x="185.3" y="148.204" width="8" height="966.005" fill="#000" fill-opacity="0"/><line x1="188.8" y1="148.204" x2="188.8" y2="1114.208" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>SCLK</title><rect x="591.5" y="148.204" width="8" height="966.005" fill="#000" fill-opacity="0"/><line x1="595" y1="148.204" x2="595" y2="1114.208" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>MOSI</title><rect x="657.5" y="148.204" width="8" height="966.005" fill="#000" fill-opacity="0"/><line x1="661" y1="148.204" x2="661" y2="1114.208" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>MISO</title><rect x="818.9" y="148.204" width="8" height="966.005" fill="#000" fill-opacity="0"/><line x1="822.4" y1="148.204" x2="822.4" y2="1114.208" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>slave</titl