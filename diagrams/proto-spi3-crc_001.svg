lipse cx="1088.2" cy="58.568" rx="8" ry="8" fill="#FBE9CF" style="stroke:#B8813A;stroke-width:0.5;"/><path d="M1088.2,66.568 L1088.2,93.568 M1075.2,74.568 L1101.2,74.568 M1088.2,93.568 L1075.2,108.568 M1088.2,93.568 L1101.2,108.568" style="stroke:#B8813A;stroke-width:0.5;" fill="none"/><text x="160.6" y="1129.174" fill="#5A3D12" font-size="14" textLength="50.4" font-family="monospace">master</text><text x="160.6" y="1148.242" fill="#5A3D12" font-size="14" textLength="50.4" font-family="monospace">pe_soc</text><ellipse cx="188.8" cy="1160.844" rx="8" ry="8" fill="#FBE9CF" style="stroke:#B8813A;stroke-width:0.5;"/><path d="M188.8,1168.844 L188.8,1195.844 M175.8,1176.844 L201.8,1176.844 M188.8,1195.844 L175.8,1210.844 M188.8,1195.844 L201.8,1210.844" style="stroke:#B8813A;stroke-width:0.5;" fill="none"/><rect x="567" y="1114.208" width="56" height="52.136" fill="#EEF3FB" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="578.2" y="1136.174" fill="#16324F" font-size="14" textLength="33.6" font-family="monospace">SCLK</text><text x="574" y="1155.242" fill="#16324F" font-size="14" textLength="42" font-family="monospace">bit 0</text><rect x="633" y="1114.208" width="56" height="52.136" fill="#EEF3FB" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="644.2" y="1136.174" fill="#16324F" font-size="14" textLength="33.6" font-family="monospace">MOSI</text><text x="640" y="1155.242" fill="#16324F" font-size="14" textLength="42" font-family="monospace">bit 1</text><rect x="794.4" y="1114.208" width="56" height="52.136" fill="#EEF3FB" style="stroke:#4A6FA5;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="805.6" y="1136.174" fill="#16324F" font-size="14" textLength="33.6" font-family="monospace">MISO</text><text x="801.4" y="1155.242" fill="#16324F" font-size="14" textLength="42" font-family="monospace">bit 3</text><text x="1064.2" y="1129.174" fill="#5A3D12" font-size="14" textLength="42" font-family="monospace">slave</text><text x="1018" y="1148.242" fill="#5A3D12" font-size="14" textLength="134.399" font-family="monospace">decodes the pins</text><ellipse cx="1088.2" cy="1160.844" rx="8" ry="8" fill="#FBE9CF" style="stroke:#B8813A;stroke-width:0.5;"/><path d="M1088.2,1168.844 L1088.2,1195.844 M1075.2,1176.844 L1101.2,1176.844 M1088.2,1195.844 L1075.2,1210.844 M1088.2,1195.844 L1101.2,1210.844" style="stroke:#B8813A;stroke-width:0.5;" fill="none"/><polygon points="583,175.91,593,179.91,583,183.91,587,179.91" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="188.8" y1="179.91" x2="589" y2="179.91" style="stroke:#333;stroke-width:1;"/><text x="195.8" y="174.101" fill="#000" font-size="13" textLength="148.2" font-family="monospace">CS_N (bit 2) 1 -> 0</text><polygon points="583,207.616,593,211.616,583,215.616,587,211.616" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="188.8" y1="211.616" x2="589" y2="211.616" style="stroke:#333;stroke-width:1;"/><text x="195.8" y="205.807" fill="#000" font-size="13" textLength="382.2" font-family="monospace">SCLK idles HIGH — the reset level happens to be 1</text><path d="M172.8,223.616 L459.6,223.616 L459.6,233.322 L449.6,243.322 L172.8,243.322 L172.8,223.616" style="stroke:#B0B0B0;stroke-width:1.5;" fill="#FBFBFB"/><rect x="172.8" y="223.616" width="931.4" height="215.648" fill="none" style="stroke:#B0B0B0;stroke-width:1.5;"/><text x="187.8" y="238.513" fill="#000" font-size="13" textLength="241.8" font-weight="700" font-family="monospace">WORD — 16 rises, MOSI MSB first</text><polygon points="649,273.028,659,277.028,649,281.028,653,277.028" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="188.8" y1="277.028" x2="655" y2="277.028" style="stroke:#333;stroke-width:1;"/><text x="195.8" y="271.219" fill="#000" font-size="13" textLength="234" font-family="monospace">rise 0..7   0001 0001   = 0x11</text><polygon points="833.4,304.734,823.4,308.734,833.4,312.734,829.4,308.734" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="827.4" y1="308.734" x2="1087.2" y2="308.734" style="stroke:#333;stroke-width:1;"/><text x="839.4" y="302.925" fill="#000" font-size="13" textLength="226.2" font-family="monospace">MISO idle LOW for rises 0..23</text><polygon points="649,336.44,659,340.44,649,344.44,653,340.44" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="188.8" y1="340.44" x2="655" y2="340.44" style="stroke:#333;stroke-width:1;"/><text x="195.8" y="334.631" fill="#000" font-size="13" textLength="234" font-family="monospace">rise 8..15  0011 0100   = 0x34</text><path d="M506.2,353.44 L506.2,433.44 L815.2,433.44 L815.2,363.44 L805.2,353.44 L506.2,353.44" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M805.2,353.44 L805.2,363.44 L815.2,363.44 L805.2,353.44" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="512.2" y="372.337" fill="#000" font-size="13" textLength="265.2" font-family="monospace">measured on the wire: word = 1134.</text><text x="512.2" y="390.043" fill="#000" font-size="13" textLength="280.8" font-family="monospace">0x1134 is not a bit palindrome - its</text><text x="512.2" y="407.749" fill="#000" font-size="13" textLength="288.6" font-family="monospace">reversal is 0x3411 - so a master that</text><text x="512.2" y="425.455" fill="#000" font-size="13" textLength="257.4" font-family="monospace">shifted the other way is visible.</text><path d="M172.8,457.264 L646.8,457.264 L646.8,466.97 L636.8,476.97 L172.8,476.97 L172.8,457.264" style="stroke:#B0B0B0;stroke-width:1.5;" fill="#FBFBFB"/><rect x="172.8" y="457.264" width="1106.8" height="187.648" fill="none" style="stroke:#B0B0B0;stroke-width:1.5;"/><text x="187.8" y="472.161" fill="#000" font-size="13" textLength="429" font-weight="700" font-family="monospace">CRC8(WORD) — 8 rises, the transmit-side integrity check</text><polygon points="649,506.676,659,510.676,649,514.676,653,510.676" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="188.8" y1="510.676" x2="655" y2="510.676" style="stroke:#333;stroke-width:1;"/><text x="195.8" y="504.867" fill="#000" font-size="13" textLength="241.8" font-family="monospace">rise 16..23  1100 1110   = 0xCE</text><path d="M917.8,523.676 L917.8,639.676 L1257.8,639.676 L1257.8,533.676 L1247.8,523.676 L917.8,523.676" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1247.8,523.676 L1247.8,533.676 L1257.8,533.676 L1247.8,523.676" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="923.8" y="542.573" fill="#000" font-size="13" textLength="296.4" font-family="monospace">the slave recomputes CRC-8 over the 16</text><text x="923.8" y="560.279" fill="#000" font-size="13" textLength="312" font-family="monospace">bits it decoded and requires it to equal</text><text x="923.8" y="577.985" fill="#000" font-size="13" textLength="312" font-family="monospace">these 8. A reference datapath written in</text><text x="923.8" y="595.691" fill="#000" font-size="13" textLength="319.8" font-family="monospace">Verilog straight from the polynomial says</text><text x="923.8" y="613.397" fill="#000" font-size="13" textLength="288.6" font-family="monospace">the same thing: a CRC checked against</text><text x="923.8" y="631.103" fill="#000" font-size="13" textLength="171.6" font-family="monospace">itself proves nothing.</text><path d="M670,662.912 L949,662.912 L949,672.618 L939,682.618 L670,682.618 L670,662.912" style="stroke:#B0B0B0;stroke-width:1.5;" fill="#FBFBFB"/><rect x="670" y="662.912" width="434.2" height="116.824" fill="none" style="stroke:#B0B0B0;stroke-width:1.5;"/><text x="685" y="677.809" fill="#000" font-size="13" textLength="234" font-weight="700" font-family="monospace">RESP — 8 rises, MISO MSB first</text><polygon points="833.4,712.324,823.4,716.324,833.4,720.324,829.4,716.324" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="827.4" y1="716.324" x2="1087.2" y2="716.324" style="stroke:#333;stroke-width:1;"/><text x="839.4" y="710.515" fill="#000" font-size="13" textLength="241.8" font-family="monospace">rise 24..31  0110 1111   = 0x6F</text><path d="M691,729.324 L691,774.324 L953,774.324 L953,739.324 L943,729.324 L691,729.324" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M943,729.324 L943,739.324 L953,739.324 L943,729.324" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="697" y="748.221" fill="#000" font-size="13" textLength="241.8" font-family="monospace">resp = word XOR 0x7E5A, applied</text><text x="697" y="765.927" fill="#000" font-size="13" textLength="226.2" font-family="monospace">byte-wise by the slave model.</text><path d="M13,797.736 L401.2,797.736 L401.2,807.442 L391.2,817.442 L13,817.442 L13,797.736" style="stroke:#B0B0B0;stroke-width:1.5;" fill="#FBFBFB"/><rect x="13" y="797.736" width="1091.2" height="152.236" fill="none" style="stroke:#B0B0B0;stroke-width:1.5;"/><text x="28" y="812.633" fill="#000" font-size="13" textLength="343.2" font-weight="700" font-family="monospace">CRC8(RESP) — 8 rises, the receive-side check</text><polygon points="833.4,847.148,823.4,851.148,833.4,855.148,829.4,851.148" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="827.4" y1="851.148" x2="1087.2" y2="851.148" style="stroke:#333;stroke-width:1;"/><text x="839.4" y="845.339" fill="#000" font-size="13" textLength="241.8" font-family="monospace">rise 32..39  0000 1010   = 0x0A</text><path d="M34,864.148 L34,944.148 L343,944.148 L343,874.148 L333,864.148 L34,864.148" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M333,864.148 L333,874.148 L343,874.148 L333,864.148" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="40" y="883.045" fill="#000" font-size="13" textLength="241.8" font-family="monospace">the firmware recomputes this in</text><text x="40" y="900.751" fill="#000" font-size="13" textLength="257.4" font-family="monospace">software and compares. Exactly 40</text><text x="40" y="918.457" fill="#000" font-size="13" textLength="288.6" font-family="monospace">rises: a master that clocked 39 or 41</text><text x="40" y="936.163" fill="#000" font-size="13" textLength="265.2" font-family="monospace">would still shift plausible bytes.</text><polygon points="583,983.678,593,987.678,583,991.678,587,987.678" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="188.8" y1="987.678" x2="589" y2="987.678" style="stroke:#333;stroke-width:1;"/><text x="195.8" y="981.869" fill="#000" font-size="13" textLength="85.8" font-family="monospace">CS_N 0 -> 1</text><path d="M144.6,1000.678 L144.6,1098.678 L1131.6,1098.678 L1131.6,1010.678 L1121.6,1000.678 L144.6,1000.678" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1121.6,1000.678 L1121.6,1010.678 L1131.6,1010.678 L1121.6,1000.678" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="341.5" y="1019.575" fill="#000" font-size="13" textLength="553.8" font-family="monospace">MODE 3 IS NOT MODE 0 WITH THE CLOCK INVERTED.  Both modes sample on the</text><text x="341.5" y="1037.281" fill="#000" font-size="13" textLength="577.2" font-family="monospace">RISING edge, so a mode-0 program is a plausible-looking mode-3 program for</text><text x="341.5" y="1054.987" fill="#000" font-size="13" textLength="569.4" font-family="monospace">the first half-frame and then delivers bit k-1 as bit k — shifted by one,</text><text x="341.5" y="1072.693" fill="#000" font-size="13" textLength="585" font-family="monospace">with nothing on the wire that looks wrong. The two things that catch it are</text><text x="341.5" y="1090.399" fill="#000" font-size="13" textLength="491.4" font-family="monospace">a slave that decodes the pins, and the check on the IDLE LEVEL.</text><?plantuml-src XLRRRk9847ttLvIoBpCI81iJXecqAoN4arW38S9HiW-HHetTXbQQRczt0yFRVCH-uNx9LhNj17BP1GdPhkEwd3fLZHDESiXkKrZhWaCC__pw6xJYCCv-t41fs9g3i3088HjFleCHbjiE20MbtXWe1PU53UoJK1L3B1IyP1lflcdbRkZLgLRQLYpdnG7ebXadSb4nvIvO_hGqUgEAiPRQm6-Sbt6v-02iJS5D0nomOSbEtmTI-0OM3UF-e3o0dUTEcpTXomN_ch-57GPSZ4PHp5v33aATihY8-WU0ZF-ruIhdLnYfUYSaVJ-47uKEwNiOsXYzQuon_mG1etJWPCsiu-PHLVo7rVa9C0lJe7hX1aweaOzg8Ho4tZm-DazdMLgR8s-UlJAdsQmsnzwSje6jP5l-g0gUev0ik1M7IYZhGLaGJA7x1upXh1RM9tBG_mmHFGrVZ5vaef3eu3gzklPg94-6M-v0yYsNi69LnHL6qB3W40N4QWKFi_cbXqV3LgLK2Kop2vIfiIu0y65c68O04FPwNm0W3CEe_W7u7SAVKOJ8Z90f8gbSdn1CPWyeUbCxfvVxyHkNerulEYMN4RgCmh1n6GyGgRJZeBVS8AFu7DQSsOtX1KwRBt4d33-37VOTtucYUD3pC4ee7j0CeWDWGCHLJ0fL68q3rWNXh0SQ9CTO9WbA8J65BbYDhzIIm23CUQHTYT9XO8ggySV0ZktfjQsmOY4v1UQgy1a7TE4PRdWUpyUZJqJsPy_sg2MRd3d3b5qBrxK2TubGZY-DS7l8Lpn_UaDMD2GE0Mj5eYByRTWQ9qTiPJvdSkyLXdNcUbrj73O1S-cEQXJPew678aCMMO5QYGKmhC3WR26__Zdg1k-ORFtwli4vOafkQ02XO8vLpArWX-axhh0K3xxdHaYz18k5YkNAuNxKwrhfMkwLNWkatxAzVKcPbg1R2RKymqPWlZKNbDMIuNJK3S64kIoXCbYAxpEzy9zTc2VPxJ7_NgY7Od-Mi2UxF-ZrOfHuI3mZsQtQXz-Eo4uRATaAhLwBVyxc2FkId9vt00TF2bpbdkMzuzqTkLxi3xf3fuZyVm5H_ky827lBnPRN-cbLSrn8tCT2llgnnKB2PzM4vqU5J9zRW7oiTymS2GS9jcrJhIwTjvDE287NjWV9JznhSeydNqq99NbsF4oGI-rxYVdWOXX47hdJ6rcWH8IKzQH19Td63vOdpNx0pl623Eak2eA3YZf-5AQpomIFwJI3czbTVHV2Gtft3NVN2Omdi_5tI6_ka_bTSja3k40n-QPOqcA5ETJh1ZtDqoozkG9UB7cdMHI8wuQamoMTCiWHUqc-AxN60sXPe-9d5Ex4u9bfwt0zox9R_t4WHj6WS1IbeEtajzTJDw8pmLzw2RJx28M4_pmww6qdCEjc3WxtOqqx9M9nDZKE2TpHtjdfUiXiqnVcyXMDEhOIlR56czxs-dpgj5dMUckZfPUJ12R9VJBf1Msp_WK0?></g></svg>